name: Preparar pandoc
description: >-
  Instala o pandoc de um binário ESTÁTICO, fixado por versão e por hash — sem `apt`, sem dpkg,
  sem dependências.

# POR QUE ASSIM, E NÃO PELO `apt` (20/11/2026).
#
# O pandoc é o compilador de Markdown para HTML de todo o sistema: o `tools/gerar-ciclo.sh`
# chama-o uma vez por documento do pacote, o `tools/criar-escola.sh` para a apresentação da escola
# e o `tools/gerar-raiz.sh` para a página da raiz. Sem ele não há site. Ele FICA.
#
# O QUE NÃO FICAVA ERA O MÉTODO. Instalar pelo `apt` custava 25 a 33 s por execução, e a medição
# mostrou que o custo não eram os pacotes — era a cerimónia: copiar os `.deb` do cache para
# `/var/cache/apt/archives`, o `Reading database` do dpkg (que varre o sistema instalado inteiro)
# e os gatilhos. Com um pacote ou com quatro, o mesmo quarto de minuto. Runs 44781355240 e
# 44781717178: 26 s e 33 s no passo, e 59 s e 75 s no job, com 16 s de variação entre os dois sem
# nada diferente no repositório.
#
# E o pacote em si é o problema: o binário do pandoc no Debian pesa **199 MB** (Haskell sem
# `strip`). O que o próprio projecto publica é estático, com as bibliotecas ligadas dentro:
# **28 MB comprimidos**, 131 MB extraídos. Descomprimir leva 0,7 s; conferir o hash, 0,1 s.
# Trocou-se um quarto de minuto por menos de cinco segundos.
#
# A VERSÃO É A MESMA QUE O `apt` INSTALAVA (3.1.3), e isso não é coincidência: é o que garante que
# o HTML sai IGUAL. Medido antes de adoptar — cinco fontes reais (o plano, a aula, a notação, a
# captura e o guia do professor) renderizadas pelas duas versões com o template `ciclo.html`:
# **byte a byte idênticas**. É a única prova que importa: um pandoc mais novo poderia mudar o
# `--toc`, o `{#id}` ou o tratamento de `raw_tex`, e o `check-pacote` compararia 240 âncoras de
# um documento diferente do que a pesquisadora vê.
#
# O HASH É A TRAVA. O `sha256sum` corre em TODA execução, e o arquivo do cache é conferido como o
# que vem da rede: um cache corrompido, um download truncado ou um asset substituído falham aqui,
# antes de gerar nada. **Ao subir a versão, mudam-se quatro coisas juntas** — a URL, o nome do
# arquivo, o `key` do cache e o hash — e o cache invalida sozinho, porque a chave leva os dois
# últimos.
#
# O QUE NÃO SE PERDE COM O `apt`. Nada que o repositório use: o `--data-dir` do pandoc não é
# tocado por gerador nenhum (o template é o `tools/templates/ciclo.html`, que é nosso, e os
# embutidos estão compilados dentro do binário). O tarball traz só `bin/` e `share/man`.

runs:
  using: composite
  steps:
    - name: Conferir o sistema
      shell: bash
      run: |
        set -euo pipefail
        # O binário fixado é `linux-amd64`. Noutro sistema o arquivo seria outro, e falhar com
        # uma mensagem que o diz é melhor do que descomprimir um ELF num runner que não o corre.
        if [ "${{ runner.os }}" != "Linux" ] || [ "${{ runner.arch }}" != "X64" ]; then
          echo "erro: o binário fixado é linux-amd64, e este runner é ${{ runner.os }}/${{ runner.arch }}" >&2
          echo "      Publicar o asset certo em .github/actions/preparar-pandoc/action.yml." >&2
          exit 1
        fi

    # O CACHE GUARDA O ARQUIVO BAIXADO, E NÃO A ÁRVORE EXTRAÍDA. É de propósito: assim a
    # conferência do hash corre em toda execução, e não só na primeira. Descomprimir são 0,7 s —
    # barato a mais para se ganhar a garantia de que o binário que corre hoje é o que o hash diz.
    - name: Restaurar o arquivo do binário
      id: binario
      uses: actions/cache@v4
      with:
        path: ~/.cache/danca-pandoc/pandoc-3.1.3-linux-amd64.tar.gz
        key: pandoc-3.1.3-linux-amd64-74bc434908e4d858

    - name: Baixar o binário
      if: steps.binario.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.cache/danca-pandoc
        curl -fsSL --retry 3 --retry-delay 2 \
          -o ~/.cache/danca-pandoc/pandoc-3.1.3-linux-amd64.tar.gz \
          https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz

    - name: Conferir o hash e instalar
      shell: bash
      run: |
        set -euo pipefail
        ARQUIVO=~/.cache/danca-pandoc/pandoc-3.1.3-linux-amd64.tar.gz
        ESPERADO=74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d

        obtido="$(sha256sum "$ARQUIVO" | awk '{print $1}')"
        if [ "$obtido" != "$ESPERADO" ]; then
          echo "erro: o hash do binário do pandoc não confere." >&2
          echo "  esperado: $ESPERADO" >&2
          echo "  obtido:   $obtido" >&2
          echo "  O arquivo está em $ARQUIVO — apague-o (ou a chave do cache) e repita." >&2
          exit 1
        fi
        echo "ok: hash do binário confere"

        DESTINO="$HOME/.local/danca-pandoc"
        rm -rf "$DESTINO"
        mkdir -p "$DESTINO"
        tar xzf "$ARQUIVO" -C "$DESTINO" --strip-components=1
        echo "$DESTINO/bin" >> "$GITHUB_PATH"

    - name: Conferir
      shell: bash
      run: |
        set -euo pipefail
        # O caminho é explícito porque o `>> $GITHUB_PATH` do passo anterior só vale para os
        # passos SEGUINTES. Daqui para baixo, os workflows encontram o `pandoc` no PATH.
        PANDOC="$HOME/.local/danca-pandoc/bin/pandoc"
        echo "ok: pandoc $("$PANDOC" --version | head -1 | awk '{print $2}')"

        # O SMOKE TEST SEPARA «O BINÁRIO ARRANCA» DE «O BINÁRIO COMPILA O NOSSO DOCUMENTO». Um tar
        # truncado que ainda descomprima daria um `--version` verde e falharia na geração — tarde,
        # depois de metade do pacote escrita. Aqui compila-se um documento mínimo com o template
        # de VERDADE do projecto e com as MESMAS opções do gerador (`--toc --toc-depth=3`,
        # `markdown+raw_tex+header_attributes`), e conferem-se as três coisas de que ele depende:
        # o template aplicado, o índice da página, e o `{#id}` que dá as âncoras.
        saida="$(printf -- '---\ntitle: "Prova"\n---\n\n## Uma seção {#uma-secao}\n\ntexto\n' \
          | "$PANDOC" -f markdown+raw_tex+header_attributes --to=html5 --standalone \
              --toc --toc-depth=3 --template=tools/templates/ciclo.html)"
        for esperado in '<!DOCTYPE html>' 'class="toc-local"' 'id="uma-secao"' 'href="#uma-secao"'; do
          case "$saida" in
            *"$esperado"*) : ;;
            *) echo "erro: o documento de prova saiu sem $esperado — o binário arranca mas não renderiza o que o gerador precisa." >&2
               exit 1 ;;
          esac
        done
        echo "ok: compila o template do projecto (standalone, toc e header_attributes)"
