name: Preparar pandoc e TeX
description: >-
  Instala pandoc, TeX e pdfinfo com o conjunto MÍNIMO medido, reusando os .deb de um cache.

# POR QUE ESTE CONJUNTO, E NÃO O `texlive-*` INTEIRO (22/10/2026).
#
# Medido no run 39660657812 (a geração que falhou com o professor secundário): o passo
# «Instalar pandoc, TeX e pdfinfo» levava 116 s de um job de 127 s — 91% do tempo, em toda
# execução, e o runner é descartado no fim. A maior parte era `texlive-fonts-extra`: **1,7 GB
# instalados**, mais do que todos os outros juntos — e ZERO arquivos abertos por ele.
#
# A prova não é estimativa. O documento do ciclo foi compilado com o cabeçalho real
# (`tools/templates/ciclo-cabecalho.tex` + `tools/lib-tokens.js --latex`), e cada arquivo que
# o `pdflatex` abriu foi mapeado ao pacote Debian que o fornece (`dpkg -S`). O resultado:
# `texlive-base`, `texlive-latex-base`, `texlive-latex-recommended`, `texlive-latex-extra` e
# `lmodern` — 191 MB, contra 1,9 GB. `texlive-fonts-extra` e `texlive-fonts-recommended` não
# aparecem uma vez sequer. O projeto não usa `fontspec` nem fonte OpenType, de propósito (ver
# o comentário do cabeçalho: neste ambiente o engine é o pdflatex).
#
# O QUE GARANTE QUE A LISTA NÃO APODRECEU. O passo «Conferir» chama `kpsewhich` em 20 arquivos
# — um de cada pacote que o documento carrega, mais o da língua (`babel-portuguese-brazil.tex`,
# que vem do `texlive-base`). Se alguém acrescentar um `\usepackage` novo ao cabeçalho e o
# pacote correspondente não estiver aqui, a execução FALHA dizendo qual arquivo falta, em vez
# de gerar um PDF sem o recurso. É o oposto do modo de falha que este repositório mais teme:
# passar sem ter verificado.
#
# O CACHE. `actions/cache` guarda só os `.deb` (é o que ele consegue restaurar sem sudo no
# momento da restauração). Isso corta o `apt-get update` e o download; a descompactação
# continua a acontecer, porque o banco do dpkg não se cacheia de forma confiável. É por isso
# que a redução da LISTA vale mais do que o cache — e as duas estão aqui.
#
# A chave do cache é o hash DESTE arquivo: mexer na lista invalida o cache sozinho, sem
# ninguém precisar lembrar de subir um número de versão.

inputs:
  com-tex:
    description: >-
      'true' instala TeX (o PDF do ciclo precisa dele). 'false' instala só pandoc e pdfinfo —
      é o caso do `criar-escola.yml`, que monta o pacote-zero sem compilar LaTeX.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restaurar os .deb do cache
      id: debs
      uses: actions/cache@v4
      with:
        path: ~/.cache/danca-debs
        key: debs-${{ runner.os }}-${{ inputs.com-tex }}-${{ hashFiles('.github/actions/preparar-tex/action.yml') }}

    - name: Instalar pandoc, TeX e pdfinfo
      shell: bash
      run: |
        set -euo pipefail

        pacotes="pandoc poppler-utils"
        if [ "${{ inputs.com-tex }}" = "true" ]; then
          pacotes="$pacotes texlive-base texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern"
        fi

        # A TENTATIVA DIRETA PRIMEIRO, QUANDO HÁ CACHE. Com os `.deb` restaurados em
        # /var/cache/apt/archives, o `apt-get install` os usa e não vai à rede. Se o índice do
        # runner já não casar com as versões guardadas (o espelho do Ubuntu avançou), a
        # instalação falha — e aí o caminho normal assume. Não se apaga o índice antes de
        # tentar: é justamente ele (o que vem na imagem) que evita o `apt-get update`.
        if [ "${{ steps.debs.outputs.cache-hit }}" = "true" ]; then
          sudo cp ~/.cache/danca-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          if sudo apt-get install -y -q --no-install-recommends $pacotes; then
            echo "instalado do cache"
            exit 0
          fi
          echo "o cache não serviu para este índice — seguindo pelo caminho normal" >&2
        fi

        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends $pacotes

        # Guardar só o que esta instalação realmente baixou.
        mkdir -p ~/.cache/danca-debs
        sudo cp /var/cache/apt/archives/*.deb ~/.cache/danca-debs/ 2>/dev/null || true
        echo "cache semeado: $(ls -1 ~/.cache/danca-debs | wc -l) pacote(s)"

    - name: Conferir
      shell: bash
      run: |
        set -euo pipefail

        faltando=0
        exigir() {
          if ! command -v "$1" > /dev/null 2>&1; then
            echo "erro: '$1' não está no PATH — o conjunto instalado por .github/actions/preparar-tex não o trouxe" >&2
            faltando=1
          fi
        }
        exigir pandoc
        exigir pdfinfo

        if [ "${{ inputs.com-tex }}" = "true" ]; then
          exigir pdflatex
          # Um arquivo por pacote Debian da lista, mais os que o cabeçalho e o template do
          # pandoc carregam. `kpsewhich` sai vazio quando o pacote não está instalado.
          for f in \
            amssymb.sty iftex.sty \
            fancyhdr.sty hyperref.sty geometry.sty longtable.sty amsmath.sty babel.sty \
            microtype.sty parskip.sty booktabs.sty footnotehyper.sty xcolor.sty \
            sectsty.sty newunicodechar.sty xurl.sty upquote.sty textcomp.sty \
            lmodern.sty babel-portuguese-brazil.tex
          do
            if [ -z "$(kpsewhich "$f" || true)" ]; then
              echo "erro: '$f' não é encontrado pelo kpsewhich — falta o pacote que o fornece (o mapa está em .github/actions/preparar-tex/action.yml)" >&2
              faltando=1
            fi
          done
        fi

        [ "$faltando" = 0 ] || exit 1
        echo "ok: pandoc $(pandoc --version | head -1 | awk '{print $2}')"
