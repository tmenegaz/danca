name: Criar a escola (motor completo)

# A página `danca` cria a ESCOLA «zero» (o Worker + subdomínio + segredos) no
# Cloudflare, por dentro do Worker raiz — mas o MOTOR completo (porta + Bastidores +
# geração) nasce aqui: este workflow roda o `tools/criar-escola.sh` (que monta
# professor + ciclo + pacote-zero + `wrangler.<escola>.jsonc`) e sobe o motor com
# `wrangler deploy`. Os segredos (SENHA_ADMIN, SENHA_CRIPTO, GITHUB_TOKEN) foram
# gravados pela página no Worker — o `wrangler deploy` troca o CÓDIGO, mas os
# segredos persistem.
#
# É o «caminho (a)»: criar a escola inteiramente no Cloudflare, sem o terminal.
# O único segredo que este workflow precisa é o CLOUDFLARE_API_TOKEN (para o
# wrangler falar com o Cloudflare) — nada de senha de professor/escola passa por aqui.

on:
  workflow_dispatch:
    inputs:
      professor:
        description: 'Slug do professor (pasta em professores/)'
        required: true
        type: string
      professor-nome:
        description: 'Nome de exibição do professor'
        required: true
        type: string
      escola:
        description: 'Slug da escola (o subdomínio)'
        required: true
        type: string
      escola-nome:
        description: 'Nome de exibição da escola'
        required: true
        type: string
      responsavel:
        description: 'Responsável pelo espaço'
        required: true
        type: string
      ciclo:
        description: 'Número do ciclo, dois dígitos'
        required: true
        type: string
        default: '01'
      frequencia:
        description: 'Frequência semanal (ex.: 2x/semana)'
        required: true
        type: string
        default: '2x/semana'
      dias:
        description: 'Dias+horas ISO (ex.: 2@19:00,4@19:00)'
        required: true
        type: string
        default: '2@19:00,4@19:00'
      duracao:
        description: 'Duração em minutos'
        required: true
        type: string
        default: '60'
      data-inicio:
        description: 'Data de início (dd/mm/aaaa) — vazia deixa a lacuna [Preencher: ...], o plano a estabelece'
        required: false
        type: string
        default: ''
      shard:
        # O SHARD QUE SERVE ESTA ESCOLA (15/11/2026). Vazio = um Worker por escola (o regime de
        # sempre). Preenchido = a escola nasce dentro do shard, e é o motor DELE que se sobe — não
        # um Worker novo. Quem preenche é a raiz, a partir da `vars` `SHARD_SCRIPT`.
        description: 'Script do shard que serve esta escola (vazio = Worker próprio)'
        required: false
        type: string
        default: ''
      modalidade:
        # A HABILIDADE QUE O PROFESSOR DECLAROU (25/11/2026). Até aqui era um valor fixo no
        # scaffolder (`bale-classico`), porque quem criava escolas era só a proprietária e ela é
        # professora de balé clássico. Com a página pública, quem declara é QUEM ENTRA — a
        # decisão dela: «agora ele é que vai determinar nesse cadastro».
        #
        # VAZIO É UM VALOR LEGÍTIMO: significa «o professor já existe», e nesse caso o perfil dele
        # já foi escrito e o scaffolder não lhe toca (a habilitação é da pessoa, não da escola).
        description: 'Modalidade que o professor novo declara ensinar (vazio = professor já existente)'
        required: false
        type: string
        default: ''

# O push do scaffold precisa de escrita. O GITHUB_TOKEN não redispara workflows,
# então o commit daqui não volta a chamar este workflow em laço.
permissions:
  contents: write

concurrency:
  group: criar-escola-${{ inputs.escola }}
  cancel-in-progress: false

jobs:
  criar:
    # `ubuntu-24.04` fixo pelo mesmo motivo do `gerar-ciclo.yml`: a chave do cache de pacotes é
    # indexada pela imagem do runner, e `ubuntu-latest` muda de versão sem avisar.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-node

      # Só pandoc: o scaffold monta o pacote-zero e não compila LaTeX. O `pdfinfo` vem junto
      # porque a ação confere o que instalou, e ele custa poucos KB.
      - uses: ./.github/actions/preparar-tex
        with:
          com-tex: 'false'

      - name: Montar o scaffold (professor + ciclo + pacote-zero + wrangler)
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail
          tools/criar-escola.sh \
            --professor "${{ inputs.professor }}" \
            --professor-nome "${{ inputs.professor-nome }}" \
            --escola "${{ inputs.escola }}" \
            --escola-nome "${{ inputs.escola-nome }}" \
            --responsavel "${{ inputs.responsavel }}" \
            --ciclo "${{ inputs.ciclo }}" \
            --frequencia "${{ inputs.frequencia }}" \
            --dias "${{ inputs.dias }}" \
            --duracao "${{ inputs.duracao }}" \
            --data-inicio "${{ inputs.data-inicio }}" \
            ${{ inputs.shard != '' && format('--shard {0}', inputs.shard) || '' }} \
            ${{ inputs.modalidade != '' && format('--modalidade {0}', inputs.modalidade) || '' }} \
            --nao-interativo

      # A DEPENDÊNCIA TEM DE ESTAR ESCRITA AQUI (20/10/2026). O `assets.directory` do Worker é a
      # publicação montada, e ela é SAÍDA — não vem no clone. A montagem é feita pelo
      # `criar-escola.sh`, mas o passo abaixo não pode depender de um efeito lateral de outro
      # passo: foi assim que a escola `batata` morreu no deploy, em «The directory specified by
      # the "assets.directory" field ... does not exist». Montar é idempotente e custa nada.
      - name: Montar a publicação da escola
        shell: bash
        run: |
          set -euo pipefail
          #
          # NUM SHARD, TODAS E NÃO UMA (15/11/2026): a árvore é partilhada, e subir o shard com a
          # montagem de uma escola apagaria as páginas das outras. `--shard` monta todas as que o
          # declaram, e recusa-se a montar zero.
          if [ -n "${{ inputs.shard }}" ]; then
            node tools/montar-publicacao.js --shard "${{ inputs.shard }}"
          else
            node tools/montar-publicacao.js "${{ inputs.escola }}"
          fi

      # O KV DA ESCOLA NOVA (07/11/2026). O namespace é COMPARTILHADO por todas as escolas, e o
      # expurgo já falhou uma vez de forma declarada (19/10/2026 — o elo sem a metade do KV, com
      # a cota do `kv.list` esgotada a meio). Uma escola criada depois disso herda o que ficou,
      # em silêncio, e nasce com a aparência de estar nova — foi a pergunta dela: «como é que
      # estes dois exercícios foram parar à memória do KV da escola?».
      #
      # ESTE PASSO LÊ E DIZ. Não apaga nada: criar uma escola pode ser RECRIAR por cima de uma
      # escola viva (é o caso normal desta casa), e apagar o KV no acto de criar destruiria o
      # cadastro de quem está a trabalhar. E não falha o build — um aviso que trava a criação
      # aprende-se a contornar, e aí a conferência deixa de existir.
      - name: Conferir o KV da escola
        shell: bash
        continue-on-error: true
        run: |
          node escola/conferir-kv.js --escola "${{ inputs.escola }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12

      # O MAPA DE ESCOLAS ANTES DO DEPLOY (13/11/2026). A escola de um pedido deixou de vir da
      # `vars` `ESCOLA_SLUG` e passou a vir do mapa `escolas/por-host`, em KV. A ordem é a única
      # que funciona: **primeiro escreve-se o mapa, só depois é que o Worker sobe**. Ao contrário,
      # a escola nasceria sem ninguém saber de quem é o Worker — e a página que ela veria seria a
      # de configuração incorrecta.
      #
      # O passo lê as configurações (é delas que o mapa sai), e por isso apanha a escola que o
      # passo anterior acabou de gerar. Não falha o build por um KV que já está em dia.
      - name: Publicar o mapa de escolas
        shell: bash
        run: |
          set -euo pipefail
          node tools/publicar-mapa-de-escolas.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12

      # O MOTOR QUE SE SOBE — E NUM SHARD É UM SÓ (15/11/2026).
      #
      # No regime de um Worker por escola, cada escola sobe o dela. Num shard, o motor é o do
      # shard, e subir `wrangler.<escola>.jsonc` criaria mais um Worker — o contrário do que o
      # shard existe para fazer. O `if` é sobre o input, e não sobre uma descoberta: quem sabe que
      # a escola nasceu num shard é quem a criou, e ele di-lo.
      - name: Subir o motor completo no Cloudflare
        id: motor
        shell: bash
        run: |
          set -euo pipefail
          alvo="wrangler.${{ inputs.escola }}.jsonc"
          if [ -n "${{ inputs.shard }}" ]; then
            alvo="wrangler.${{ inputs.shard }}.jsonc"
            echo "escola servida pelo shard '${{ inputs.shard }}' — o motor que se sobe é o dele"
          fi
          [ -f "$alvo" ] || { echo "erro: $alvo não existe"; exit 1; }
          ./node_modules/.bin/wrangler deploy -c "$alvo"
          echo "motor=$alvo" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12

      - name: Commitar o scaffold
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # A ORDEM, E PORQUE É ESTA: A ÂNCORA PRIMEIRO, OS ÍNDICES DEPOIS (01/11/2026).
          #
          # Os índices são DERIVADOS — e um deles, `ciclos_com_ancora`, conta as âncoras que
          # existem. Regerá-los antes de a âncora nascer dá um índice que diz `0` sobre um
          # `.fipp` que vai entrar no mesmo commit. Foi o que aconteceu com a `calango`, criada
          # minutos depois de a âncora entrar aqui: o `.fipp` foi escrito (o passo 5 e a prova
          # do pacote confirmam-no, `hash-ciclo --check` → «íntegro»), e o índice dizia
          # `ciclos_com_ancora: 0`, com o `check-indices` a acusar três divergências.
          #
          # Ordem errada não é erro de forma: é um derivado a mentir sobre um facto que existe,
          # que é pior do que não ter o facto — o primeiro vê-se, o segundo não.
          #
          # ── 1. A ÂNCORA ────────────────────────────────────────────────────────
          # O `reancorar.yml` corre a cada push de `professores/**`, e a documentação conta com
          # isso (AGENTS.md, a tabela dos cinco caminhos de escrita). Mas o push deste workflow
          # usa o `GITHUB_TOKEN`, e o GitHub NÃO dispara workflows a partir desses pushes: é o
          # que impede o laço, e é também o que deixou a `breu` nascer sem âncora a 01/11/2026.
          # O `criar-escola.sh` não ancora — o rodapé dele manda ancorar à mão. Aqui é o único
          # ponto em que a escola existe e ainda se pode escrever no mesmo commit.
          #
          # ── 2. OS ÍNDICES ──────────────────────────────────────────────────────
          # Sem esta parte, cada escola criada deixava `indices/` a apontar para um passado: a
          # `breu` nasceu e o `check-indices` passou a acusar três divergências, porque nada
          # regera o que deriva. A criação é um dos caminhos que escrevem no `main`, e era o
          # único que nascia sem o derivado.
          #
          # NENHUM DOS DOIS DERRUBA A CRIAÇÃO. O motor já está no ar neste ponto, e os dois são
          # artefactos: uma falha avisa e segue — o rollback logo abaixo
          # (`if: failure() && steps.motor.outcome != 'success'`) destruiria uma escola viva por
          # causa de uma âncora ou de um índice. O remédio é à mão, e está na mensagem:
          # `tools/hash-ciclo.sh <prof> <ciclo> <escola>` e `node tools/gerar-indices.js`.
          tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.escola }}" \
            || echo "::warning::a âncora não foi gerada — rode tools/hash-ciclo.sh ${{ inputs.professor }} ${{ inputs.ciclo }} ${{ inputs.escola }}"

          node tools/gerar-indices.js \
            || echo "::warning::os índices não foram regerados — rode node tools/gerar-indices.js"
          # O MAPA DE RELAÇÕES É IRMÃO DO ÍNDICE (15/11/2026). Os dois derivam das mesmas fontes e
          # escrevem no mesmo `indices/`; o `regerar-indices.yml` já os corre juntos, e este passo
          # só corria um. Medido: as três escolas criadas a 15/11 deixaram
          # `indices/relacoes/<professor>/01-<escola>.json` por escrever, e o `check-indices`
          # reprovou a reconstrução. Um derivado que só nasce no push seguinte é um derivado que
          # falta no commit que o tornou necessário.
          node tools/gerar-relacoes.js \
            || echo "::warning::o mapa de relações não foi regerado — rode node tools/gerar-relacoes.js"

          # UM CAMINHO QUE NÃO EXISTE DERRUBA O `git add` INTEIRO (15/11/2026), e foi o que
          # aconteceu no run 43755682428: «fatal: pathspec 'wrangler.calango.jsonc' did not match
          # any files», exit 128 — depois de o motor já ter subido e com o scaffold por commitar.
          # Num shard a escola NÃO TEM esse config: é a mesma premissa das três peças anteriores
          # (o mapa, a conferência do KV, a recriação), agora no `git add`.
          #
          # A lista passa a ser a dos caminhos que EXISTEM. O `wrangler.<escola>.jsonc` entra
          # quando existe (o regime de sempre); o `wrangler.<shard>.jsonc` não entra NUNCA por
          # aqui — ele já está versionado, e este commit não é dele.
          CAMINHOS=(
            "professores/${{ inputs.professor }}"
            "escola/${{ inputs.escola }}"
            "indices/"
          )
          if [ -f "wrangler.${{ inputs.escola }}.jsonc" ]; then
            CAMINHOS+=("wrangler.${{ inputs.escola }}.jsonc")
          fi
          git add -A -- "${CAMINHOS[@]}"

          if git diff --cached --quiet; then
            echo "nada a commitar"
            exit 0
          fi

          git commit -m "feat(estrutura): criar a escola ${{ inputs.escola }} (motor completo)" \
            -m "Scaffold gerado pelo workflow quando a página danca criou a escola — professor/ciclo/pacote-zero, e o wrangler.<escola>.jsonc quando a escola tem Worker próprio (num shard não tem: é o índice que declara qual a serve). Os segredos ficaram no KV da escola e nos secrets do Worker, nunca aqui." \
            -m "Refs: tools/criar-escola.sh, .github/workflows/criar-escola.yml
          Regras: P-03, P-04, P-17
          Auditoria: sim"

          # O PUSH PODE PERDER A CORRIDA (19/10/2026). Três workflows escrevem no `main`
          # (este, o `gerar-ciclo.yml` e o `reancorar.yml`) e o `reancorar` corre a cada
          # push de `professores/**` — inclusive no commit que ESTE workflow acabou de
          # fazer. Um `git push` simples perdia para quem chegou primeiro
          # (`! [rejected] main -> main (fetch first)`, às 18:11:21 de 19/10/2026) e
          # derrubava a criação DEPOIS de o motor já estar no ar — deixando um Worker a
          # servir uma escola que não existe no repositório, e sem o rollback a correr
          # (ele é cancelado quando o motor sobe, o que é o correcto quando o motor subiu).
          #
          # Aqui não há âncora para conflitar: os caminhos que este commit toca são NOVOS
          # (`professores/<professor>` da escola nova, `escola/<slug>`, `wrangler.<slug>`),
          # e ninguém mais os escreve. Um conflito de verdade continua a falhar.
          for intento in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push recusado (tentativa $intento) — rebaseando sobre o main"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "erro: conflito ao rebase — o scaffold desta escola não se aplica sobre o main" >&2
              git rebase --abort || true
              exit 1
            fi
            sleep $((intento * 5))
          done
          echo "erro: o push continuou recusado depois de 5 tentativas" >&2
          exit 1

      # ---------------------------------------------------------------------
      # O ROLLBACK DO ÓRFÃO.
      #
      # A página `danca` cria o Worker «zero» (Worker + subdomínio + segredos) e SÓ DEPOIS
      # dispara este workflow. Entre uma coisa e a outra a escola existe no Cloudflare e não
      # existe em lugar nenhum: sem pasta em `escola/`, sem `wrangler.<escola>.jsonc`, sem
      # nada no Git. Se este workflow falha, nada desfazia o Worker — e ele ficava no ar a
      # responder 200 no subdomínio de uma escola que nunca nasceu. Foi a `valsa` de
      # 17/10/2026: criada às 09:36:04Z, o workflow morto às 09:36:09Z.
      #
      # A CONDIÇÃO TEM DUAS METADES, e as duas são necessárias:
      #
      #   `steps.motor.outcome != 'success'` — se o motor SUBIU, não há órfão: há uma escola a
      #   funcionar, e o que falhou foi o commit do scaffold. Apagar o Worker seria destruir o
      #   que está bom para corrigir o que está em falta.
      #
      #   `failure()` — só se corre quando algo falhou. Num sucesso não há nada a desfazer.
      #
      # E dentro do script há uma terceira guarda, a decisiva: `desfazer-placeholder.js` LÊ o
      # código que está no ar e só apaga se ainda for o placeholder DESTA escola. Uma escola a
      # sério nunca é tocada, mesmo que as duas condições acima digam «pode apagar» — a
      # intenção não é a evidência. Na dúvida, não apaga.
      # ---------------------------------------------------------------------
      - name: Desfazer o Worker «zero» (a escola não chegou a nascer)
        if: failure() && steps.motor.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          node tools/desfazer-placeholder.js \
            --escola "${{ inputs.escola }}" \
            --nome "${{ inputs.escola-nome }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12
