name: Publicar a raiz (Sistema Lastro)

# A RAIZ não é uma escola: é a porta de entrada do sistema — a página «Sistema Lastro», o
# «Criar nova escola» e o cron do expurgo (§17.5). Tem Worker próprio, o `danca`, e até
# 17/10/2026 ele era publicado À MÃO. O preço foi cobrado duas vezes no mesmo dia:
#
#   1. a raiz no ar era de 14:54 e o `criar-escola.sh` corrigido foi commitado às 15:04 —
#      a escola `valse` nasceu com o formulário antigo, que derivava o slug do professor do
#      NOME de exibição («Tiago» → `tiago`) em vez da pasta (`tiago-menegaz`), e escrevia o
#      PO numa pasta fantasma;
#   2. o mesmo atraso manteve no ar o `post-merge` que apagava a escola recém-criada.
#
# Nos dois casos o commit estava certo e a produção, velha. Nem o `git log` nem o painel
# sabiam dizer o que estava no ar — só o `wrangler` de quem tinha paciência para perguntar.
#
# Daqui em diante, o push que toca no que a raiz EMPACOTA publica a raiz.
#
# O QUE SE PUBLICA É O QUE ESTÁ NO COMMIT. Não há passo de geração aqui, e é de propósito:
# `raiz/index.html` e `raiz/assets/*` são versionados, regenerados por `tools/gerar-raiz.sh`
# a partir de `biblioteca/apresentacao.md`. Gerar no runner tornaria o deploy irreprodutível
# a partir do commit — e um `pandoc` diferente do local travaria o deploy PARA SEMPRE, porque
# nenhum `gerar-raiz.sh` rodado na máquina conseguiria reproduzir a saída do CI. A conferência
# da identidade (`tools/check-identidade.js`) é determinística e roda aqui: é ela que impede
# que uma folha ou um nav velhos cheguem à produção com aval de «ok».

on:
  push:
    branches: [main]
    # Porque `motor/servidor/**` inteiro e não uma lista de ficheiros: o bundle da raiz é um
    # SUBCONJUNTO de `motor/servidor/` (`raiz.js` + o que ele `require`: provisionar-escola,
    # expurgar-escola, repo-escola, estado-html, escrever-po, escrever-plano). Uma lista
    # nominal apodreceria no dia em que alguém acrescentasse um `require` — e o modo de falha
    # é exactamente o que este workflow existe para matar: commit novo, raiz velha. Publicar
    # a raiz sem necessidade custa segundos; publicá-la velha custou dois incidentes.
    paths:
      - 'workers/raiz.js'
      - 'motor/servidor/**'
      - 'raiz/**'
      - 'wrangler.danca.jsonc'
      - 'tools/check-identidade.js'
      # A folha e o nav não vivem só aqui: `tools/templates/` é a fonte, e a raiz serve uma
      # cópia. Um push que muda a fonte sem regerar a cópia faz o job FALHAR no passo da
      # identidade — e falhar é o correcto: a raiz serviria a identidade anterior. O remédio
      # está na mensagem (`tools/gerar-raiz.sh`) e é um comando.
      - 'tools/templates/**'
      - '.github/workflows/deploy-raiz.yml'
  workflow_dispatch:

permissions:
  contents: read

# Um deploy de cada vez, e sem cancelar o que já está a subir: dois `wrangler deploy`
# simultâneos do mesmo Worker disputam a versão activa.
concurrency:
  group: deploy-raiz
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conferir a identidade antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-identidade.js

      - name: Subir a raiz no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy -c wrangler.danca.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12

      - name: Dizer o que ficou no ar
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "### raiz publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`danca\` (raiz do sistema, não é escola)" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://danca.tmenegaz77.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
