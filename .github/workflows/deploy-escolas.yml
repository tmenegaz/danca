name: Publicar as escolas

# POR QUE ESTE WORKFLOW EXISTE. Em 17/10/2026 o dono do produto abriu as duas escolas de
# teste e disse: «não identifiquei em nenhuma delas os ajustes». Os commits estavam certos
# e no `main`; os pacotes versionados tinham a folha nova; e os dois Workers serviam a
# folha ANTERIOR. Medido: `assets/style.css` no ar com md5 `91509d8…`, no repositório com
# `122e570…`. Nada publicava.
#
# É a MESMA falha que já tinha custado dois incidentes na raiz — e é a razão pela qual o
# `deploy-raiz.yml` existe. Até agora, o único caminho que publicava uma escola era o
# `gerar-ciclo.yml`, que é `workflow_dispatch` (manual) e que roda o gerador ANTES. E o
# gerador RECUSA um ciclo cujo `DATA_INICIO` ainda é lacuna — o que é o estado normal de
# qualquer escola recém-criada. Ou seja: o único caminho automático estava fechado
# exactamente para as escolas que mais mudam, as de teste.
#
# O QUE SE PUBLICA É O QUE ESTÁ NO COMMIT. Não há passo de geração aqui, e é de propósito:
# o pacote do ciclo É versionado (é dele que o Worker serve), e gerar no runner tornaria o
# deploy irreprodutível a partir do commit — com o agravante de que o `pandoc` e o
# `pdflatex` do runner podem diferir do local e travar o deploy para sempre. Quem gera é
# quem tem as fontes; quem publica é este workflow, e ele publica o que passou no commit.
#
# A IDENTIDADE É CONFERIDA ANTES. `check-identidade.js` é determinístico e roda aqui; é ele
# que impede que uma folha velha chegue à produção com aval de «ok» — foi esse aval que
# faltou hoje.

on:
  push:
    branches: [main]
    # O que uma escola SERVE é o conteúdo do seu pacote (a pasta do ciclo) mais o motor
    # que o Worker empacota. Não se lista arquivo por arquivo dentro do pacote: um
    # `assets/nav.js` novo tem de publicar, e uma lista nominal apodreceria em silêncio.
    # O QUE UMA ESCOLA SERVE É O PACOTE MONTADO, E SÓ ELE (22/10/2026). A lista era
    # `professores/**`, e isso fazia o deploy subir o site inteiro por arquivos que ele não
    # serve: cada `-po.md`, `-plano.md`, `-dados.json` e cada `.fipp` reancorado disparava um
    # `wrangler deploy` completo. Medido no «Guardar» do PO de 21/10/2026 às 19:19: dez commits
    # em quatro segundos, dez deploys enfileirados (`cancel-in-progress: false`, e é o correcto
    # para deploy), cada um montando e subindo a escola para publicar exactamente o mesmo site.
    #
    # A pergunta que ficou no lugar é a certa: «este arquivo chega ao que a escola serve?».
    # Quem responde é `tools/montar-publicacao.js`, e ele lê duas coisas de `professores/`:
    # as pastas dos pacotes (`ciclo-*/`) e os `.conf` — destes, o `NOME` da turma e o `ESCOLA`
    # da escola, que viram o MENU. O resto (fontes `.md`, `-dados.json`, `.fipp`, relatórios,
    # cadernos) não é lido por ninguém no caminho da publicação.
    paths:
      - 'professores/**/ciclos/ciclo-*/**'
      - 'professores/**/ciclos/*.conf'
      - 'motor/**'
      - 'workers/**'
      - 'wrangler.*.jsonc'
      - 'tools/templates/**'
      # A montagem é ela própria parte do que se publica: mudar como o site é composto muda o
      # site, e antes disso não havia gatilho nenhum — a alteração só valia no deploy seguinte,
      # por acidente de outro arquivo.
      - 'tools/montar-publicacao.js'
      - 'tools/check-identidade.js'
      - '.github/workflows/deploy-escolas.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      escola:
        description: 'Slug de UMA escola (vazio publica todas)'
        required: false
        default: ''

permissions:
  contents: read

# Um deploy de cada vez por escola, sem cancelar o que já está a subir: dois
# `wrangler deploy` simultâneos do mesmo Worker disputam a versão activa.
concurrency:
  group: deploy-escolas
  cancel-in-progress: false

jobs:
  # A LISTA É DESCOBERTA, NÃO ESCRITA À MÃO. Cada escola é um `wrangler.<slug>.jsonc`. O
  # `wrangler.danca.jsonc` fica de fora: a raiz não é escola e tem o seu próprio workflow.
  # Uma escola nova passa a ser publicada no dia em que ganha o config — sem ninguém
  # lembrar de editar este arquivo.
  #
  # O FILTRO PELO `assets.directory` MORREU AQUI (22/10/2026), e com ele um mês de deploys
  # silenciosamente vazios. Ele procurava `"directory": "professores/…"` — o valor que a
  # config tinha antes de o site da escola passar a ser montado em `publicacao/<escola>/`.
  # Depois dessa mudança o `grep` deixou de casar, `escolas` saía `[]` e o job `publicar`
  # ficava `skipped` em TODOS os runs: push após push, `motor/**` e `tools/templates/**`
  # chegavam ao repositório e nunca ao Worker. Medido no run 39660372285 — e foi por isto
  # que a correção dos schemas do professor secundário não apareceu em produção.
  #
  # A PERGUNTA CERTA é «o pacote desta escola ainda existe?», e ela não depende de onde o
  # `assets.directory` aponta: o pacote-zero (`professores/<prof>/ciclos/ciclo-NN-<slug>/`)
  # é a FONTE do site, e é ele que o expurgo apaga. Se ele existe, há o que publicar.
  descobrir:
    runs-on: ubuntu-24.04
    outputs:
      escolas: ${{ steps.lista.outputs.escolas }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        shell: bash
        # O filtro entra por `env`, não por interpolação no script: um valor digitado no
        # `workflow_dispatch` nunca pode virar comando. Vazio (push) publica todas.
        env:
          FILTRO: ${{ github.event.inputs.escola }}
        run: |
          set -euo pipefail
          filtro="${FILTRO:-}" 
          lista='[]'
          for cfg in wrangler.*.jsonc; do
            [ -f "$cfg" ] || continue
            slug="${cfg#wrangler.}"; slug="${slug%.jsonc}"
            [ "$slug" = danca ] && continue
            # A ESCOLA EXPURGADA NÃO SE PUBLICA (19/10/2026). O expurgo apaga o Worker e as
            # chaves do KV, mas o `wrangler.<slug>.jsonc` e o pacote só saem do repositório
            # noutro commit. Um run que JÁ ESTAVA na fila quando a escola foi apagada sobe
            # depois com o commit antigo — e `wrangler deploy` RECRIA o Worker de uma escola
            # que já não existe. O sintoma seria o pior possível: o expurgo parece ter
            # falhado, ou a escola volta ao ar sozinha. O pacote é o que a escola SERVE; sem
            # ele não há o que publicar.
            #
            # A FONTE DO SITE é o pacote-zero, e é ele que se procura — em qualquer professor,
            # porque a escola pode ter turmas de mais de um. O `assets.directory` NÃO entra
            # nesta conta: ele aponta a SAÍDA (`publicacao/<slug>`), que é git-ignored e só
            # existe depois da montagem.
            dir=$(ls -d professores/*/ciclos/ciclo-[0-9][0-9]-"$slug" 2>/dev/null | head -1 || true)
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then
              echo "pulando $slug — o pacote-zero de '$slug' já não existe (escola expurgada)"
              continue
            fi
            if [ -n "$filtro" ] && [ "$filtro" != "$slug" ]; then continue; fi
            lista=$(printf '%s' "$lista" | node -e '
              const l = JSON.parse(require("fs").readFileSync(0, "utf8"));
              l.push(process.argv[1]); process.stdout.write(JSON.stringify(l));' "$slug")
          done
          echo "escolas=$lista" >> "$GITHUB_OUTPUT"
          echo "descobertas: $lista"

  publicar:
    needs: descobrir
    if: needs.descobrir.outputs.escolas != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # Uma escola que falha não impede as outras de subir: são Workers independentes, e
      # travar a publicação de uma por causa da outra esconde o problema em vez de o dizer.
      fail-fast: false
      matrix:
        escola: ${{ fromJSON(needs.descobrir.outputs.escolas) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-node

      - name: Conferir a identidade antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          node tools/check-identidade.js

      # MONTAR ANTES DE PUBLICAR (22/10/2026). O `assets.directory` é `publicacao/<escola>`,
      # que é uma SAÍDA: não está no repositório e não existe num checkout limpo. Sem esta
      # linha o `wrangler deploy` não encontra a pasta — e, antes desta correção, nem chegava
      # a ser tentado, porque a descoberta já tinha descartado a escola.
      # AS BANCADAS DE LAYOUT VÃO COM O SITE (24/10/2026) — `--com-propostas`.
      #
      # O motivo é o de sempre, e é o mesmo que pôs a opção no `montar-publicacao.js`: a decisão
      # de layout é tomada NO TELEMONE, e o telemone não lê o repositório. Sem esta linha as
      # bancadas só abrem no `file://` de quem as construiu — que é exactamente o que a
      # pesquisadora recusou em 23/10/2026 («é pra estar tudo em produção»).
      #
      # O QUE ISTO **NÃO** FAZ: não entra no `nav.json`, não é um documento da escola e nenhum
      # menu a anuncia. Ela vive em `/propostas/`, é autossuficiente (CSS embutido) e sai na
      # primeira montagem sem a opção. Nada disto toca em conteúdo de ciclo, na âncora, nas
      # regras ou nas pétreas.
      # AS PÁGINAS DAS BANCADAS SÃO GERADAS — e não estão no Git (`experimentos/propostas/*`).
      #
      # Sem este passo, o `--com-propostas` abaixo avisa «pedido sem propostas montadas» e segue
      # sem elas: num checkout limpo a pasta só tem o construtor. Aconteceu no primeiro deploy
      # desta opção, e o aviso do próprio `montar-publicacao.js` disse qual era a linha que
      # faltava — degradar com uma mensagem certa custou um deploy, em vez de uma sessão.
      - name: Construir as bancadas de layout
        shell: bash
        run: |
          set -euo pipefail
          node experimentos/propostas/construir.js

      - name: Montar o site de ${{ matrix.escola }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/montar-publicacao.js ${{ matrix.escola }} --com-propostas

      - name: Subir ${{ matrix.escola }} no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy -c "wrangler.${{ matrix.escola }}.jsonc"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12

      - name: Dizer o que ficou no ar
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### escola \`${{ matrix.escola }}\` publicada"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- https://${{ matrix.escola }}.tmenegaz77.workers.dev/"
          } >> "$GITHUB_STEP_SUMMARY"
