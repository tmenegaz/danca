name: Provar a preparação do TeX

# TEMPORÁRIO (22/10/2026) — existe para exercitar `.github/actions/preparar-tex` ANTES de a
# próxima geração de ciclo depender dele. O `deploy-raiz` já provou a ação do Node; esta não
# tem nenhum outro consumidor que corra sozinho (`criar-escola` e `gerar-ciclo` são
# `workflow_dispatch`), e uma ação que nunca corre é uma promessa, não uma ferramenta.
#
# O QUE ELE FAZ: instala o conjunto mínimo e compila o documento do ciclo com o cabeçalho
# REAL do repositório — o mesmo `pandoc` + `pdflatex` do gerador. Se algum pacote faltar, o
# passo «Conferir» da ação diz qual; se o conjunto for suficiente, o PDF sai.
#
# Apagar este arquivo depois de verde: ele não é parte do produto.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-node

      - uses: ./.github/actions/preparar-tex

      - name: Compilar o documento com o cabeçalho real
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          node tools/lib-tokens.js --latex > "$tmp/cores.tex"
          sed -e 's|@NOME@|Ciclo de prova|g' -e 's|@CICLO@|01|g' \
              -e 's|@PERIODO@|03/03/2027 a 30/06/2027|g' \
              tools/templates/ciclo-cabecalho.tex > "$tmp/cab.tex"
          python3 - "$tmp/cab.tex" "$tmp/cores.tex" <<'PY'
          import sys
          alvo, cores = sys.argv[1], sys.argv[2]
          linhas = open(alvo, encoding='utf-8').read().split('\n')
          bloco = open(cores, encoding='utf-8').read().rstrip('\n')
          marc = [i for i, l in enumerate(linhas) if l.strip() == '@CORES@']
          assert len(marc) == 1, marc
          linhas[marc[0]:marc[0] + 1] = bloco.split('\n')
          open(alvo, 'w', encoding='utf-8').write('\n'.join(linhas))
          PY
          cat > "$tmp/corpo.md" <<'MD'
          ---
          title: "Ciclo 01 — prova"
          subtitle: "Escola — 2x/semana, 60 min"
          author: "Professor"
          date: "03/03/2027 a 30/06/2027"
          lang: pt-BR
          ---

          **Escola:** prova · **Frequência:** 2x/semana · **Duração por dia:** 60 min.

          ## Objetivo

          Acentuação: ação, coração, ção. Símbolos do cabeçalho: ≠ ✓ ● ↺ ⌒ ☐.

          | Bloco | Coluna |
          |:--|:--|
          | A | B |
          MD
          pandoc "$tmp/corpo.md" -o "$tmp/prova.pdf" --toc --toc-depth=3 \
            --from=markdown+raw_tex+header_attributes --pdf-engine=pdflatex \
            -V geometry:margin=2cm -V colorlinks=true -V lang=pt-BR \
            -V toc-title="Índice" --include-in-header="$tmp/cab.tex"
          paginas="$(pdfinfo "$tmp/prova.pdf" | awk '/^Pages/{print $2}')"
          echo "PDF gerado: $paginas página(s)"
          {
            echo "### preparar-tex — ok"
            echo ""
            echo "- pdf: $paginas página(s)"
            echo "- pandoc: $(pandoc --version | head -1 | awk '{print $2}')"
          } >> "$GITHUB_STEP_SUMMARY"
