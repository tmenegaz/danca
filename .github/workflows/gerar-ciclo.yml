name: Gerar o ciclo

# O NOME DA EXECUÇÃO É UMA CHAVE (19/10/2026).
#
# Quem pergunta «como vai a geração?» é a tela, e ela procura a execução pelo
# `display_title` — este `run-name`. O texto tem de ser IDÊNTICO ao que
# `motor/servidor/geracao.js` compõe (`rotuloDaGeracao`): professor/ciclo/variante.
# Sem esse acordo, duas gerações simultâneas de escolas diferentes seriam
# indistinguíveis e a tela mostraria o estado da geração de outra pessoa. A prova
# `experimentos/provar-geracao.js` compara as duas strings.
run-name: Gerar o ciclo · ${{ inputs.professor }}/${{ inputs.ciclo }}/${{ inputs.variante || inputs.escola }}

# A GERAÇÃO não roda no Worker (workerd é JavaScript/Wasm, e o gerador precisa de
# Node + Python + pandoc + TeX). Por isso o Worker não gera: ele DISPARA. Este é o
# alvo do disparo — um `workflow_dispatch` com o professor, o ciclo e a escola que o
# PO concluído declarou no contexto do ato.
#
# O que ele faz: gera o pacote (HTML + PDF + menu, por `tools/gerar-ciclo.sh`),
# reancora a cadeia (`tools/hash-ciclo.sh`, porque o PO elicitado vira fonte),
# commita o que mudou e PUBLICA o pacote no Cloudflare (`wrangler deploy`).
#
# O deploy entrou na cadeia em 15/10/2026. Antes, este workflow terminava no commit:
# o pacote gerado ficava no repositório e o site só mudava com um `wrangler deploy`
# à mão — «um clique e faz tudo» não se cumpria. O pacote gerado É o
# `assets.directory` do Worker da escola: publicar é subir o pacote. Mesmo padrão
# do `criar-escola.yml` — um `CLOUDFLARE_API_TOKEN` e o id da conta; nenhuma senha
# de professor ou de escola passa por aqui.
#
# `tools/gerar-ciclo.sh` já VALIDA o pacote no fim (`node tools/check-pacote.js`):
# não há passo de validação separado. A reancoragem usa o `--check` antes de gerar,
# como em reancorar.yml — o .fipp só é tocado quando há divergência de verdade.

on:
  workflow_dispatch:
    inputs:
      professor:
        description: 'Slug do professor (pasta em professores/)'
        required: true
        type: string
        default: 'tiago'
      ciclo:
        description: 'Número do ciclo, dois dígitos'
        required: true
        type: string
        default: '01'
      escola:
        description: 'Slug da escola (o Worker: wrangler.<escola>.jsonc)'
        required: true
        type: string
        default: 'maria'
      # A ESCOLA NÃO É A VARIANTE (19/10/2026). O `.conf` que o plano compõe — com os
      # `DOCS`, o `DATA_INICIO` e o `TOTAL_AULAS` da TURMA — chama-se
      # `ciclo-<ciclo>-<escola>-<turma>.conf`. Mandando só a escola, o gerador lia o
      # `.conf` da escola (um esqueleto, `DOCS=""`) e morria com «DOCS está vazio».
      # Vazia, a variante é a própria escola: é o caso de uma escola de uma turma só,
      # e o comportamento anterior fica intacto.
      variante:
        description: 'Slug da variante (professor × ciclo × escola × turma) — vazio = a escola'
        required: false
        type: string
        default: ''

# O push do commit de geração precisa de escrita. O GITHUB_TOKEN não redispara
# workflows, então o commit daqui não volta a chamar esta workflow em laço.
permissions:
  contents: write

# Uma geração por ciclo por vez: duas disparadas juntas sobrescreveriam o mesmo
# pacote. A última da fila espera a anterior terminar.
concurrency:
  group: gerar-ciclo-${{ inputs.professor }}-${{ inputs.ciclo }}-${{ inputs.variante || inputs.escola }}
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pandoc, TeX e pdfinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern \
            poppler-utils

      # Sem o passo das senhas locais: a senha de criptografia vive no Worker (SENHA_CRIPTO), e a
      # cópia cifrada do `-dados.json` nasce no «Guardar» do PO (caminho (a)). O gerador só COPIA
      # o `.cifrado.json`; o `check-pacote.js` confere a estrutura da cópia contra a fonte (a
      # garantia byte a byte fica para a máquina da pesquisadora, que tem tools/.senhas-locais).

      - name: Gerar e validar o pacote
        shell: bash
        run: |
          set -euo pipefail
          # O gerador NÃO herda o locale (lib-locale.sh exige UTF-8).
          tools/gerar-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"

      - name: Reancorar a cadeia
        shell: bash
        run: |
          set -euo pipefail
          # Só reancora se a âncora divergiu — idempotente, como em reancorar.yml.
          if tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}" --check > /dev/null 2>&1; then
            echo "âncora íntegra — nada a reancorar"
          else
            tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"
          fi

      - name: Commitar o pacote gerado
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          pasta="professores/${{ inputs.professor }}/ciclos/ciclo-${{ inputs.ciclo }}-${{ inputs.variante || inputs.escola }}"
          # A ÂNCORA É IRMÃ DO PACOTE, não filha: `hash-ciclo.sh` a escreve em
          # `ciclo-<ciclo>-<variante>.fipp`. O `*.fipp` antigo era um pathspec relativo à
          # raiz e não casava com nada — a reancoragem saía do passo e ficava fora do
          # commit, e o `--check` seguinte achava divergência outra vez, para sempre.
          git add -A -- "$pasta"
          if [ -f "$pasta.fipp" ]; then git add -A -- "$pasta.fipp"; fi

          if git diff --cached --quiet; then
            echo "nada a commitar"
            exit 0
          fi

          git commit -m "chore(entrega): gerar o pacote de ${{ inputs.professor }}/${{ inputs.ciclo }}/${{ inputs.variante || inputs.escola }}" \
            -m "Geração disparada pelo Worker quando o PO foi concluído — o pacote e a âncora refletem o recorte elicitado." \
            -m "Refs: tools/gerar-ciclo.sh, tools/hash-ciclo.sh, .github/workflows/gerar-ciclo.yml
          Regras: Regra 16, P-04, P-17
          Auditoria: tools/check-pacote.js (dentro do gerador) + hash-ciclo.sh --check"

          # O PUSH PODE PERDER A CORRIDA, E O `.fipp` TEM DOIS DONOS (19/10/2026).
          #
          # O «Guardar» do PO commita as fontes uma a uma (o `escrever-ciclo.js`), e cada
          # commit dispara o `reancorar.yml`. Segundos depois o Worker dispara ESTE
          # workflow. Quando a geração termina, o `reancorar` já commitou a mesma âncora —
          # com as fontes que existiam ANTES do pacote. Resultado medido às 17:47:41 de
          # 19/10/2026: `push` recusado, e o rebase morria em
          # «CONFLICT (content): ... ciclo-01-batata-bale-nivel-1-teste-2.fipp».
          #
          # Resolver esse conflito à mão (ou com `-X ours`) seria escolher entre duas
          # âncoras — e a âncora NÃO SE ESCOLHE: ela é DERIVADA das fontes. O certo é
          # regerá-la depois de o rebase aplicar o commit sobre o `main` novo. É o que
          # este laço faz: rebaseia; se o rebase parar num `.fipp`, aceita a versão que
          # está a ser aplicada, termina o rebase, e **reancora de novo** com o
          # `hash-ciclo.sh` — a única definição de âncora que existe.
          for intento in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push recusado (tentativa $intento) — rebaseando sobre o main"
            git fetch origin main

            if git rebase origin/main; then
              sleep $((intento * 5))
              continue
            fi

            # O rebase parou. Se for SÓ a âncora, ela regera-se; qualquer outro conflito
            # é de conteúdo e tem de falhar — dois donos do mesmo texto é um problema de
            # desenho, e escondê-lo aqui seria pior.
            conflitos="$(git diff --name-only --diff-filter=U || true)"
            if [ -z "$conflitos" ] || printf '%s\n' "$conflitos" | grep -qv '\.fipp$'; then
              echo "erro: conflito de conteúdo (não é a âncora) — não se resolve automaticamente:" >&2
              printf '%s\n' "$conflitos" >&2
              git rebase --abort || true
              exit 1
            fi

            echo "conflito APENAS na âncora — aplicar a versão do commit e regerar"
            git checkout --theirs -- '*.fipp' || git checkout --ours -- '*.fipp'
            git add -- '*.fipp'
            GIT_EDITOR=true git rebase --continue

            # A ÂNCORA REGERADA, a partir das fontes que resultaram do rebase.
            tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"
            if ! git diff --quiet -- '*.fipp'; then
              git add -- '*.fipp'
              # O MESMO COMMIT VAZIO DO `reancorar.yml` (19/10/2026). Se a âncora regerada for
              # igual à que o pai já traz e o pacote não mudou, o commit não tem o que fazer e
              # `git commit --amend` recusa («would make it empty», saída 1) — o job morria com
              # o push por fazer. Commit vazio, aqui, quer dizer que a entrega já estava no
              # `main`: descarta-se o commit, não a correcção.
              if git diff --cached --quiet HEAD^; then
                echo "o pacote e a âncora regerada não mudam nada — commit dispensado"
                git reset --soft HEAD^
              else
                git commit --amend --no-edit
              fi
            fi
            sleep $((intento * 5))
          done
          echo "erro: o push continuou recusado depois de 5 tentativas" >&2
          exit 1

      # O DEPLOY FECHA A CADEIA. O commit acima põe o pacote no repositório; o site,
      # porém, serve os ASSETS do Worker — que só mudam num `wrangler deploy`. Sem este
      # passo o ciclo era gerado, versionado e invisível: o menu continuava sem os
      # documentos derivados (Barra, 15/10/2026). O `assets.directory` de cada escola é
      # o seu pacote (`wrangler.<escola>.jsonc`), então deployar é publicar o que acabou
      # de ser gerado. `if: always()` NÃO se aplica: um pacote reprovado no
      # `check-pacote.js` (dentro do gerador) já barrou o job antes daqui, e publicar um
      # pacote pela metade seria pior que não publicar.
      - name: Publicar o pacote no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy -c "wrangler.${{ inputs.escola }}.jsonc"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12
