name: Gerar o ciclo

# O NOME DA EXECUÇÃO É UMA CHAVE (19/10/2026).
#
# Quem pergunta «como vai a geração?» é a tela, e ela procura a execução pelo
# `display_title` — este `run-name`. O texto tem de ser IDÊNTICO ao que
# `motor/servidor/geracao.js` compõe (`rotuloDaGeracao`): professor/ciclo/variante.
# Sem esse acordo, duas gerações simultâneas de escolas diferentes seriam
# indistinguíveis e a tela mostraria o estado da geração de outra pessoa. A prova
# `experimentos/provar-geracao.js` compara as duas strings.
run-name: Gerar o ciclo · ${{ inputs.professor }}/${{ inputs.ciclo }}/${{ inputs.variante || inputs.escola }}

# A GERAÇÃO não roda no Worker (workerd é JavaScript/Wasm, e o gerador precisa de
# Node + Python + pandoc + TeX). Por isso o Worker não gera: ele DISPARA. Este é o
# alvo do disparo — um `workflow_dispatch` com o professor, o ciclo e a escola que o
# PO concluído declarou no contexto do ato.
#
# O que ele faz: gera o pacote (HTML + PDF + menu, por `tools/gerar-ciclo.sh`),
# reancora a cadeia (`tools/hash-ciclo.sh`, porque o PO elicitado vira fonte),
# commita o que mudou e PUBLICA o pacote no Cloudflare (`wrangler deploy`).
#
# O deploy entrou na cadeia em 15/10/2026. Antes, este workflow terminava no commit:
# o pacote gerado ficava no repositório e o site só mudava com um `wrangler deploy`
# à mão — «um clique e faz tudo» não se cumpria. O pacote gerado É o
# `assets.directory` do Worker da escola: publicar é subir o pacote. Mesmo padrão
# do `criar-escola.yml` — um `CLOUDFLARE_API_TOKEN` e o id da conta; nenhuma senha
# de professor ou de escola passa por aqui.
#
# `tools/gerar-ciclo.sh` já VALIDA o pacote no fim (`node tools/check-pacote.js`):
# não há passo de validação separado. A reancoragem usa o `--check` antes de gerar,
# como em derivados.yml — o .fipp só é tocado quando há divergência de verdade.

on:
  workflow_dispatch:
    inputs:
      professor:
        description: 'Slug do professor (pasta em professores/)'
        required: true
        type: string
        default: 'tiago'
      ciclo:
        description: 'Número do ciclo, dois dígitos'
        required: true
        type: string
        default: '01'
      escola:
        description: 'Slug da escola (o Worker: wrangler.<escola>.jsonc)'
        required: true
        type: string
        default: 'maria'
      # A ESCOLA NÃO É A VARIANTE (19/10/2026). O `.conf` que o plano compõe — com os
      # `DOCS`, o `DATA_INICIO` e o `TOTAL_AULAS` da TURMA — chama-se
      # `ciclo-<ciclo>-<escola>-<turma>.conf`. Mandando só a escola, o gerador lia o
      # `.conf` da escola (um esqueleto, `DOCS=""`) e morria com «DOCS está vazio».
      # Vazia, a variante é a própria escola: é o caso de uma escola de uma turma só,
      # e o comportamento anterior fica intacto.
      variante:
        description: 'Slug da variante (professor × ciclo × escola × turma) — vazio = a escola'
        required: false
        type: string
        default: ''

# O push do commit de geração precisa de escrita. O GITHUB_TOKEN não redispara
# workflows, então o commit daqui não volta a chamar esta workflow em laço.
permissions:
  contents: write

# Uma geração por ciclo por vez: duas disparadas juntas sobrescreveriam o mesmo
# pacote. A última da fila espera a anterior terminar.
concurrency:
  group: gerar-ciclo-${{ inputs.professor }}-${{ inputs.ciclo }}-${{ inputs.variante || inputs.escola }}
  cancel-in-progress: false

jobs:
  gerar:
    # `ubuntu-24.04` E NÃO `ubuntu-latest` (22/10/2026). O cache de pacotes é indexado pela imagem
    # do runner: quando o `latest` vira outra versão, os `.deb` guardados deixam de casar com o
    # índice e o cache não serve. A versão fixa torna a chave previsível — e o toolchain também,
    # que é o mesmo argumento do `SOURCE_DATE_EPOCH` que este gerador já usa para o PDF ser
    # reprodutível.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar-node

      # O TeX SAIA INTEIRO A CADA EXECUÇÃO, E CUSTAVA 91% DO JOB. Medido no run 39660657812:
      # 116 s de 127 s só neste passo. A ação instala o conjunto mínimo medido (191 MB, contra
      # 1,9 GB) e reusa os `.deb` de um cache.
      #
      # E SAIU DE VEZ (20/11/2026). O PDF DO CICLO DEIXOU DE EXISTIR COMO FICHEIRO: quem imprime
      # é o navegador, a partir da própria página — que sempre teve `@media print`, e cujo
      # conteúdo é o mesmo (a folha nasce do markdown que o pandoc já converte para HTML aqui).
      #
      # O QUE ISSO POUPA, medido nos runs de 20/11/2026 — e não é o PDF, são SEGUNDOS de PDF
      # dentro de um passo de 5 a 6 s:
      #
      #   run 44770733345 · 44769892060 · 44767545583 → este passo levava 61, 67 e 68 s
      #   criar-escola (com-tex: false)               → 10 e 11 s, com o job inteiro em 30 s
      #
      # O job ia a 97–107 s e cai para ~49 s: abaixo dos 60, que é a fronteira onde o Actions
      # deixa de cobrar 2 minutos e passa a cobrar 1. O `preparar-tex` continua aqui — o pandoc
      # é de onde sai TODO o HTML do pacote — e o `pdfinfo` continua a servir o `check-pacote.js`
      # de um pacote antigo que ainda traga o seu PDF.
      - uses: ./.github/actions/preparar-tex
        with:
          com-tex: 'false'

      # Sem o passo das senhas locais: a senha de criptografia vive no Worker (SENHA_CRIPTO), e a
      # cópia cifrada do `-dados.json` nasce no «Guardar» do PO (caminho (a)). O gerador só COPIA
      # o `.cifrado.json`; o `check-pacote.js` confere a estrutura da cópia contra a fonte (a
      # garantia byte a byte fica para a máquina da pesquisadora, que tem tools/.senhas-locais).

      # A ESCOLA NÃO É A VARIANTE, E A PUBLICAÇÃO É A ÚLTIMA COISA QUE ACONTECE.
      #
      # O CASO QUE ORIGINOU ISTO (run 48, 06/11/2026, medido). Um disparo com
      # `escola=calango-bale-nivel-1-teste-1` gerou o pacote, reancorou a cadeia, COMMITOU e
      # montou a publicação — e só então o `wrangler deploy` falhou, com «Could not read file:
      # wrangler.calango-bale-nivel-1-teste-1.jsonc». O input `escola` é o WORKER (o nome do
      # `wrangler.<escola>.jsonc`), não a turma: a turma vai em `variante`. Um valor trocado
      # custava uma geração inteira e deixava um commit de pacote para trás.
      #
      # A TRACIÊNCIA É AQUI E NÃO NA PROMESSA. Não há como impedir que alguém escreva a turma no
      # campo da escola — o que há é esta conferência, antes de gerar, que diz o que houve e lista
      # os Workers que existem. Com ela, uma escola REAL também está coberta: o `criar-escola.sh`
      # nomeia o ficheiro pelo WORKER (`--worker`, e por omissão a própria escola), e um Worker
      # que não exista falha aqui em dois segundos, sem gerar nada.
      - name: Conferir o Worker da escola
        shell: bash
        env:
          ESCOLA: ${{ inputs.escola }}
          VARIANTE: ${{ inputs.variante }}
        run: |
          set -euo pipefail
          # A ESCOLA DE SHARD NÃO TEM CONFIG PRÓPRIA (15/11/2026) — e esta conferência recusava-a.
          #
          # Ela exigia `wrangler.<escola>.jsonc`, o que era verdade enquanto toda escola tinha o seu
          # Worker. Uma escola criada DENTRO de um shard não tem — é exactamente isso que a impede
          # de ganhar mais um Worker —, de modo que o disparo para a `batata` respondia «não existe
          # wrangler.batata.jsonc — 'batata' não é o nome de um Worker», e listava os Workers
          # existentes (`danca`, `lastro-teste`) como se a escola não existisse. Ela existia, e é
          # uma das três servidas pelo `lastro-teste`.
          #
          # A pergunta certa é a mesma da publicação, e a resposta é a mesma função
          # (`shard_da_escola`, de `tools/lib-shard.sh`): a escola existe se tem config OU se um
          # índice a declara num shard. Uma pergunta, uma resposta.
          # A RAIZ NÃO É ESCOLA (15/11/2026), e ela tem `wrangler.danca.jsonc` como qualquer uma.
          # Aceitá-la aqui deixaria gerar um ciclo para «danca» — uma pasta de professor com um
          # pacote de uma escola que não existe. É o mesmo marcador que o resto do motor usa para
          # a excluir (`NAO_ESCOLAS`), e não uma segunda opinião.
          if [ "$ESCOLA" = "danca" ]; then
            echo "erro: 'danca' é a RAIZ do sistema (a porta de entrada), não uma escola." >&2
            echo "      O ciclo pertence a uma escola: use o slug dela em «escola»." >&2
            exit 1
          fi
          if [ -f "wrangler.$ESCOLA.jsonc" ]; then
            echo "ok: wrangler.$ESCOLA.jsonc"
            exit 0
          fi
          if [ -f "tools/lib-shard.sh" ]; then
            # shellcheck disable=SC1091
            source tools/lib-shard.sh
            shard="$(shard_da_escola "$ESCOLA")"
            if [ -n "$shard" ] && [ -f "wrangler.$shard.jsonc" ]; then
              echo "ok: '$ESCOLA' é servida pelo shard '$shard' (wrangler.$shard.jsonc)"
              exit 0
            fi
          fi
          echo "erro: '$ESCOLA' não é uma escola deste repositório — não tem wrangler.$ESCOLA.jsonc" >&2
          echo "      nem um índice que a declare num shard." >&2
          # O ERRO MAIS COMUM, NOMEADO: pôr a TURMA no campo da escola. É o que aconteceu a
          # 15/11/2026 («batata-rosa» no campo «escola»), e a mensagem anterior só dizia «não é o
          # nome de um Worker» — verdade, e inútil para quem tinha escrito uma turma que existe.
          if ls -d professores/*/ciclos/ciclo-[0-9][0-9]-"$ESCOLA" >/dev/null 2>&1; then
            echo "" >&2
            echo "…e '$ESCOLA' é uma TURMA deste repositório (há um ciclo-NN-$ESCOLA). A ESCOLA vai" >&2
            echo "   no campo «escola», e a TURMA no campo «variante»." >&2
          fi
          echo "" >&2
          echo "O campo «escola» é a ESCOLA (o nome do Worker dela, ou o slug que o índice declara)," >&2
          echo "e a TURMA vai no campo «variante». Exemplo, para uma turma da calango:" >&2
          echo "    escola   = calango                          (a escola)" >&2
          echo "    variante = calango-bale-nivel-1-teste-1     (a turma)" >&2
          if [ -n "${VARIANTE:-}" ]; then
            echo "" >&2
            echo "Neste disparo veio variante='$VARIANTE'." >&2
            if [ -d "escola/$VARIANTE" ] || [ -f "wrangler.$VARIANTE.jsonc" ]; then
              echo "…e '$VARIANTE' é uma ESCOLA: os dois campos estão trocados." >&2
            fi
          fi
          echo "" >&2
          echo "Escolas deste repositório:" >&2
          if [ -d escola ]; then
            for d in escola/*/; do
              slug="$(basename "$d")"
              if [ -f "wrangler.$slug.jsonc" ]; then
                printf '    %-24s (Worker próprio)\n' "$slug" >&2
              else
                s=""
                if [ -f "tools/lib-shard.sh" ]; then
                  # shellcheck disable=SC1091
                  source tools/lib-shard.sh
                  s="$(shard_da_escola "$slug")"
                fi
                printf '    %-24s (shard %s)\n' "$slug" "${s:-?}" >&2
              fi
            done
          fi
          if [ -e wrangler.danca.jsonc ]; then
            printf '    %-24s (a raiz — não é escola)\n' danca >&2
          fi
          echo "" >&2
          echo "Nada foi gerado e nada foi commitado: a conferência corre antes do gerador." >&2
          exit 1

      - name: Conferir os pré-requisitos do ciclo na pasta do professor
        shell: bash
        env:
          PROFESSOR: ${{ inputs.professor }}
          CICLO: ${{ inputs.ciclo }}
        run: |
          set -euo pipefail
          pasta="professores/$PROFESSOR/ciclos"
          nn="$(printf '%02d' "$CICLO")"

          # OS DOIS QUE ABORTAM O GERADOR, e que por isso se exigem aqui: `validar-po-ciclo.js`
          # (gerar-ciclo.sh:272) e `validar-plano-ciclo.js` (:275) leem o schema e, sem ele,
          # morrem com `ENOENT` e um `exit 1` que não diz de onde veio.
          #
          # O CASO QUE ORIGINOU ISTO (run 39660657812, 21/10/2026): a primeira geração do
          # professor SECUNDÁRIO falhou exactamente assim. Os schemas nascem em
          # `tools/criar-escola.sh`, que só passa pela pasta de quem CRIA a escola — e o
          # professor que recebe a curadoria não é esse. A correção existe
          # (`motor/servidor/schemas-do-ciclo.js`, chamado ao gravar o plano e o PO); esta
          # conferência existe para que, se ela não estiver no ar no Worker da escola, a
          # execução DIGA o motivo em vez de deixar um ENOENT para trás.
          faltando=0
          for s in po-schema plano-schema; do
            arq="$pasta/ciclo-$nn-$s.json"
            [ -f "$arq" ] && continue
            echo "erro: falta $arq" >&2
            faltando=1
          done
          if [ "$faltando" = 1 ]; then
            echo "" >&2
            echo "Os schemas do ciclo são por (professor, ciclo). Faltando na pasta de '$PROFESSOR'," >&2
            echo "a causa é uma destas duas — e a segunda é a provável:" >&2
            echo "  · o plano de ensino e o PO nunca foram gravados para '$PROFESSOR' (não há o que gerar);" >&2
            echo "  · o Worker da escola corre um build anterior a 22/10/2026, que não provisiona os" >&2
            echo "    schemas de quem não criou a escola. Reabra o plano e o PO e guarde outra vez" >&2
            echo "    (é o «Guardar», com o Worker novo, que os cria), ou republique o Worker." >&2
            exit 1
          fi

          # Estes três NÃO abortam o gerador — a ausência deles degrada a validação, e o próprio
          # `gerar-ciclo.sh` tem comentário a dizer que o pacote continua. Avisar é o correcto:
          # reprovar aqui seria mais rigoroso do que o gerador.
          for s in schema aula-schema captura-schema; do
            [ -f "$pasta/ciclo-$nn-$s.json" ] || \
              echo "::warning::falta $pasta/ciclo-$nn-$s.json — o ciclo segue sem essa validação"
          done

          # E O CONTEÚDO DO SCHEMA, que a presença não garante (01/11/2026). Um `required` com um
          # campo que a derivação deixou de escrever recusa TODO documento — e o gerador só o diz
          # a meio, em «campo ausente», depois de o PO ter passado. Medido no run 41347497746: o
          # professor nascera de um molde atrasado e exigia `ciclo` e `rubrica`, que o plano não
          # escreve desde 26/10/2026.
          #
          # O filtro é por professor, e é de propósito: o gerador não se importa com os outros
          # dezasseis, e um schema alheio atrasado não deve impedir esta geração. O repositório
          # inteiro é conferido no pre-commit.
          if ! node tools/check-schemas.js --professor "$PROFESSOR"; then
            echo "" >&2
            echo "O schema do ciclo de '$PROFESSOR' não está com o contrato em vigor — e é a" >&2
            echo "primeira coisa que a geração verifica, porque é ela que recusa todo documento" >&2
            echo "derivado. Corrija o schema (alinhando-o com o contrato em vigor, que é o do" >&2
            echo "molde) e dispare outra vez." >&2
            exit 1
          fi

      - name: Gerar e validar o pacote
        shell: bash
        run: |
          set -euo pipefail
          # O gerador NÃO herda o locale (lib-locale.sh exige UTF-8).
          tools/gerar-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"

      - name: Reancorar a cadeia
        shell: bash
        run: |
          set -euo pipefail
          # Só reancora se a âncora divergiu — idempotente, como em derivados.yml.
          if tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}" --check > /dev/null 2>&1; then
            echo "âncora íntegra — nada a reancorar"
          else
            tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"
          fi

      - name: Commitar o pacote gerado
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          pasta="professores/${{ inputs.professor }}/ciclos/ciclo-${{ inputs.ciclo }}-${{ inputs.variante || inputs.escola }}"
          # A ÂNCORA É IRMÃ DO PACOTE, não filha: `hash-ciclo.sh` a escreve em
          # `ciclo-<ciclo>-<variante>.fipp`. O `*.fipp` antigo era um pathspec relativo à
          # raiz e não casava com nada — a reancoragem saía do passo e ficava fora do
          # commit, e o `--check` seguinte achava divergência outra vez, para sempre.
          #
          # E NÃO É SÓ UMA (20/10/2026). O `hash-ciclo.sh` escreve também a âncora de CADA
          # AULA — `ciclo-<ciclo>-<variante>-aula-NN.fipp`, irmã do pacote como a do ciclo —,
          # e o passo somava só a do ciclo. A da aula ficava UNTRACKED, o que parecia
          # inofensivo até o push ser recusado: o `git rebase` não começa quando o commit que
          # vai aplicar traz um arquivo que existe solto na árvore, e o laço lia isso como
          # «conflito de conteúdo» e desistia — culpando o sítio errado. O `*.fipp` daqui é o
          # mesmo pathspec do `derivados.yml`, que sempre as somou todas.
          git add -A -- "$pasta"
          git add -A -- '*.fipp'

          # O ÍNDICE ENTRA NO MESMO COMMIT — E TEM DE ENTRAR (22/10/2026). O acervo conta os
          # documentos e as âncoras do pacote que acabou de nascer, e este workflow commita com
          # o `GITHUB_TOKEN`, que POR DESENHO não redispara workflows: o `derivados.yml`
          # nunca vê este commit. Mesma regra do `derivados.yml` — quem commita com o token
          # regera o derivado no próprio commit, porque ninguém o fará depois.
          node tools/gerar-indices.js \
            || { echo "erro: os índices não foram regerados — o pacote novo não chegaria ao acervo" >&2; exit 1; }
          # O MAPA DE RELAÇÕES VAI NO MESMO COMMIT, PELA MESMA RAZÃO (05/11/2026): este workflow
          # commita com o `GITHUB_TOKEN`, e o `derivados.yml` nunca vê este commit. Um mapa
          # que ficasse para trás apontaria para uma aula que já existe e não está nele.
          node tools/gerar-relacoes.js \
            || { echo "erro: o mapa de relações não foi regerado — as arestas ficariam a apontar para um acervo velho" >&2; exit 1; }
          git add -A -- indices/

          if git diff --cached --quiet; then
            echo "nada a commitar"
            exit 0
          fi

          git commit -m "chore(entrega): gerar o pacote de ${{ inputs.professor }}/${{ inputs.ciclo }}/${{ inputs.variante || inputs.escola }}" \
            -m "Geração disparada pelo Worker quando o PO foi concluído — o pacote e a âncora refletem o recorte elicitado." \
            -m "Refs: tools/gerar-ciclo.sh, tools/hash-ciclo.sh, .github/workflows/gerar-ciclo.yml
          Regras: Regra 16, P-04, P-17
          Auditoria: tools/check-pacote.js (dentro do gerador) + hash-ciclo.sh --check"

          # A MENSAGEM FICA NUM ARQUIVO: o laço pode precisar de criar o commit de novo (quando o
          # rebase descarta o vazio), e recriá-la à mão divergiria da original. Ver
          # `.github/scripts/atualizar-commit-derivado.sh`.
          mensagem="$(mktemp)"
          git log -1 --format=%B > "$mensagem"

          # O PUSH PODE PERDER A CORRIDA, E O `.fipp` TEM DOIS DONOS (19/10/2026).
          #
          # O «Guardar» do PO commita as fontes uma a uma (o `escrever-ciclo.js`), e cada
          # commit dispara o `derivados.yml`. Segundos depois o Worker dispara ESTE
          # workflow. Quando a geração termina, o `reancorar` já commitou a mesma âncora —
          # com as fontes que existiam ANTES do pacote. Resultado medido às 17:47:41 de
          # 19/10/2026: `push` recusado, e o rebase morria em
          # «CONFLICT (content): ... ciclo-01-batata-bale-nivel-1-teste-2.fipp».
          #
          # Resolver esse conflito à mão (ou com `-X ours`) seria escolher entre duas
          # âncoras — e a âncora NÃO SE ESCOLHE: ela é DERIVADA das fontes. O certo é
          # regerá-la depois de o rebase aplicar o commit sobre o `main` novo. É o que
          # este laço faz: rebaseia; se o rebase parar num `.fipp`, aceita a versão que
          # está a ser aplicada, termina o rebase, e **reancora de novo** com o
          # `hash-ciclo.sh` — a única definição de âncora que existe.
          for intento in 1 2 3 4 5 6 7 8; do
            if git push; then
              exit 0
            fi
            echo "push recusado (tentativa $intento) — rebaseando sobre o main"
            git fetch origin main

            if git rebase origin/main; then
              sleep $((intento * 5))
              continue
            fi

            # O REBASE PODE NEM TER COMEÇADO (20/10/2026). Quando há na árvore um arquivo
            # UNTRACKED que o `main` novo também traz, o git recusa o checkout antes de
            # aplicar commit nenhum — e não há conflito para inspecionar. O `git diff
            # --diff-filter=U` volta vazio, e o laço lia isso como «conflito de conteúdo» e
            # morria, culpando o conteúdo por uma árvore suja. Aconteceu às 21:57 de
            # 20/10/2026 com `ciclo-01-breu-bale-nivel-1-teste-3-aula-01.fipp`: a âncora da
            # aula, gerada por este workflow e deixada solta pelo `git add` de então.
            if [ ! -d "$(git rev-parse --git-path rebase-merge)" ] &&
               [ ! -d "$(git rev-parse --git-path rebase-apply)" ]; then
              # Os soltos que o `main` traz são SAÍDAS desta geração: a versão canónica é a
              # que chega do `main`, e a desta árvore regenera-se depois do rebase. Só esses
              # se apagam — qualquer outro solto é trabalho de alguém, e não é daqui.
              apagados=0
              while IFS= read -r solto; do
                [ -n "$solto" ] || continue
                if git cat-file -e "origin/main:$solto" 2>/dev/null; then
                  rm -f -- "$solto"
                  apagados=$((apagados + 1))
                fi
              done < <(git ls-files --others --exclude-standard)
              if [ "$apagados" -eq 0 ]; then
                echo "erro: o rebase não começou e não há solto da geração para limpar — ver a saída acima" >&2
                exit 1
              fi
              echo "o rebase não começou: $apagados solto(s) da própria geração removido(s) — nova tentativa"
              sleep $((intento * 5))
              continue
            fi

            # O rebase parou. O DERIVADO concilia-se; o MATERIAL não — dois donos do mesmo
            # TEXTO escrito à mão é um problema de desenho, e escondê-lo aqui seria pior. A regra
            # vive num arquivo só (`.github/scripts/conflito-do-derivado.sh`), partilhado com o
            # `derivados.yml`: o `indices/**` foi a segunda metade do problema (run 39788790994,
            # 22/10/2026), e tratá-la aqui e não lá teria feito as duas versões divergirem.
            # O PACOTE DESTE CICLO É DERIVADO PARA NÓS (08/11/2026). Somos o gerador dele: um
            # conflito nos arquivos que o `gerar-ciclo.sh` produz (os PDFs, os JSON, o HTML do
            # pacote) não é «dois donos do mesmo texto» — é a mesma geração a chegar duas vezes,
            # e a resposta certa é refazê-la. O script concilia com a versão do `main`; o passo
            # abaixo REGERA sobre as fontes que o rebase deixar. Ver o cabeçalho do script.
            export DERIVADOS_DO_CHAMADOR="$pasta"$'\n'
            if ! conciliacao="$(.github/scripts/conflito-do-derivado.sh)"; then
              git rebase --abort || true
              exit 1
            fi
            printf '%s\n' "$conciliacao"
            GIT_EDITOR=true git rebase --continue

            # O PACOTE, REGERADO SOBRE O MAIN NOVO (08/11/2026) — e SÓ quando o conflito o tocou.
            # O script diz quantos arquivos do pacote conciliou (`pacote-do-chamador=N`); com zero,
            # o pacote não está em causa e nada se regera (o gerador custa minutos de pandoc e
            # pdflatex). Com N, o commit sairia com os binários do `main` e as fontes desta
            # execução — dois documentos do mesmo ciclo, que é o defeito que este laço evita. O
            # gerador é reprodutível (`SOURCE_DATE_EPOCH` e o `/ID` do PDF são fixos).
            if printf '%s' "$conciliacao" | grep -Eq 'pacote-do-chamador=[1-9]'; then
              tools/gerar-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"
              git add -A -- "$pasta"
            fi

            # A ÂNCORA REGERADA, a partir das fontes que resultaram do rebase.
            tools/hash-ciclo.sh "${{ inputs.professor }}" "${{ inputs.ciclo }}" "${{ inputs.variante || inputs.escola }}"

            # E O ÍNDICE TAMBÉM (22/10/2026). A conciliação deixou o `indices/` com a versão do
            # `main` — que é a do estado de ANTES deste pacote. Sem regerar aqui, o commit sairia
            # com o pacote novo e o acervo velho: exactamente a divergência que o `check-indices`
            # acusa depois, e que ninguém iria corrigir (o push é feito com o `GITHUB_TOKEN`).
            node tools/gerar-indices.js \
              || { echo "erro: os índices não foram regerados sobre o main novo" >&2; exit 1; }
            git add -A -- indices/

            # O PACOTE ENTRA NA MESMA CONDIÇÃO (08/11/2026): depois de ele ser regerado, o que
            # mudou está em `git add` — e sem o contar aqui o commit ficaria com a árvore à frente
            # dele e o push levaria a versão de antes.
            if ! git diff --quiet -- '*.fipp' || ! git diff --cached --quiet -- indices/ \
               || ! git diff --cached --quiet -- "$pasta"; then
              git add -- '*.fipp'
              # QUEM DECIDE SE O COMMIT É NOSSO É O SCRIPT, E OLHA A MENSAGEM (23/10/2026).
              # Antes era um `--amend` cego: quando o rebase descartava o commit vazio, o topo
              # ficava no commit de outro workflow e o `--amend` reescrevia história alheia — o
              # ramo deixava de ser descendente do `main` e o push era recusado para sempre.
              # Medido no run 39876375641 (`Regerar os índices`, o «Guardar» do PO de
              # `perna-boa/01/calango-bale-nivel-2-teste-1`).
              .github/scripts/atualizar-commit-derivado.sh "$mensagem" || exit 1
            fi
            sleep $((intento * 5))
          done
          echo "erro: o push continuou recusado depois de 8 tentativas" >&2
          exit 1

      # O DEPLOY FECHA A CADEIA. O commit acima põe o pacote no repositório; o site,
      # porém, serve os ASSETS do Worker — que só mudam num `wrangler deploy`. Sem este
      # passo o ciclo era gerado, versionado e invisível: o menu continuava sem os
      # documentos derivados (Barra, 15/10/2026). O `assets.directory` de cada escola é
      # o seu pacote (`wrangler.<escola>.jsonc`), então deployar é publicar o que acabou
      # de ser gerado. `if: always()` NÃO se aplica: um pacote reprovado no
      # `check-pacote.js` (dentro do gerador) já barrou o job antes daqui, e publicar um
      # pacote pela metade seria pior que não publicar.
      - name: Montar a publicação da escola
        shell: bash
        run: |
          set -euo pipefail
          # O WORKER SERVE A ESCOLA, E A ESCOLA TEM TURMAS (20/10/2026).
          #
          # O `assets.directory` apontava o pacote-zero — a apresentação, sem `DOCS`, logo sem
          # Ciclo nem Aulas no menu — enquanto o pacote gerado existia ao lado, no repositório e
          # não no ar. Com mais de uma turma, apontar a config a uma delas esconderia as outras.
          # `publicacao/<escola>/` é montado agora: o índice das turmas, a apresentação, a porta
          # e um subdirectório por pacote. É saída, não é versionada, e é reconstruída de zero.
          #
          # NUM SHARD, TODAS E NÃO UMA (15/11/2026). No shard o `assets.directory` é
          # `publicacao/` e a árvore é PARTILHADA: o `wrangler deploy` substitui a versão
          # inteira, portanto montar só esta escola e subir apagaria as páginas das outras.
          # `--shard` monta todas as que o declaram no índice, e recusa-se a montar zero —
          # uma árvore vazia publicada é N escolas a responder 404.
          source tools/lib-shard.sh
          shard="$(shard_da_escola "${{ inputs.escola }}")"
          if [ -n "$shard" ]; then
            echo "a escola é servida pelo shard «$shard» — monta-se o shard inteiro"
            node tools/montar-publicacao.js --shard "$shard"
          else
            node tools/montar-publicacao.js "${{ inputs.escola }}"
          fi

      - name: Publicar o pacote no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          # O MOTOR QUE SE SOBE SEGUE A MESMA PERGUNTA DO PASSO ANTERIOR (15/11/2026). Uma
          # escola de shard não tem `wrangler.<escola>.jsonc` — subir esse caminho falhava com
          # «Could not read file», e a geração de uma escola de shard ficava sem publicação.
          source tools/lib-shard.sh
          shard="$(shard_da_escola "${{ inputs.escola }}")"
          if [ -n "$shard" ]; then
            alvo="wrangler.$shard.jsonc"
          else
            alvo="wrangler.${{ inputs.escola }}.jsonc"
          fi
          echo "motor: $alvo"
          ./node_modules/.bin/wrangler deploy -c "$alvo"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2628f36f9f72bd539b417dcb173d1f12
