name: Reancorar a cadeia

# A âncora de proveniência (tools/hash-ciclo.sh -> .fipp) cobre as FONTES do ciclo.
# Entre elas está o `-dados.json` — o arquivo que o formulário de lançamento reescreve
# a cada aula lançada (tools/lib-fontes.sh, fontes_do_ciclo). Ou seja: lançar uma aula
# desatualiza a âncora, e reancorar deixou de ser evento raro.
#
# Este workflow fecha esse ciclo: quando uma fonte muda, ele reancora e commita o
# .fipp. A cadência é a do push — não há relógio próprio.
#
# Ele VALIDA antes de reancorar. Rodar o modo `gerar` sempre reescreveria `ancorado_em`
# (hash-ciclo.sh:105, `date +%F`) mesmo sem mudança de conteúdo, e o repositório
# ganharia um commit por dia por nada. Com o `--check` na frente, o `.fipp` só é
# tocado quando há divergência de verdade, e o workflow é idempotente.

on:
  push:
    branches: [main]
    paths:
      - 'professores/**'
      - 'tools/lib-fontes.sh'
  workflow_dispatch:

# O push do commit de reancoragem precisa de escrita. Um push feito com o
# GITHUB_TOKEN não redispara workflows, então isto não vira laço.
permissions:
  contents: write

# Duas execuções correndo juntas reancorariam a mesma cadeia e uma sobrescreveria a
# outra. A última fila espera a anterior terminar.
#
# CANCELA A ANTERIOR, E É SEGURO (22/10/2026). A âncora NÃO SE ESCOLHE: é DERIVADA das fontes
# por `tools/hash-ciclo.sh`, e o `--check` é idempotente. Uma execução cancelada não deixa
# estado — o commit ou foi empurrado ou não foi —, e a seguinte recalcula a âncora a partir das
# fontes que existirem então. O que NÃO se cancela é o `wrangler deploy` do `deploy-escolas`,
# porque um upload interrompido a meio é outra coisa.
#
# O que isto resolve: o «Guardar» do PO grava um arquivo por vez, um commit por arquivo. Medido
# às 19:19:31 de 21/10/2026 — dez commits em quatro segundos. Com `false`, eram dez execuções
# deste workflow EM SÉRIE, cada uma com checkout, Node e um laço de `--check` sobre todos os
# manifestos, só para chegar ao mesmo `.fipp` que a última ia calcular de qualquer maneira.
concurrency:
  group: reancorar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reancorar:
    # Fixo pelo mesmo motivo dos outros: o cache dos pacotes depende da imagem do runner.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # `hash-ciclo.sh` chama `node` duas vezes: validar-schema-ciclo.js e
      # validar-po-ciclo.js. Os validadores não têm dependência externa, então
      # `npm ci` não é necessário — só o interpretador. Por isso `instalar: 'false'`:
      # baixar `node_modules` aqui só acrescentaria segundos a um job que não usa wrangler.
      - uses: ./.github/actions/preparar-node
        with:
          instalar: 'false'

      - name: Reancorar os ciclos que divergiram
        id: reancorar
        shell: bash
        run: |
          set -uo pipefail

          # A matriz sai do disco: um professor/ciclo/escola por manifesto de variante
          # (`ciclo-XX-<escola>.conf`). O `ciclo-XX.conf` sozinho é o manifesto base, não
          # uma escola — por isso ele não casa neste glob. Assim uma escola nova entra
          # na reancoragem sem editar este arquivo.
          shopt -s nullglob
          manifestos=(professores/*/ciclos/ciclo-*-*.conf)

          # ZERO MANIFESTOS NÃO É ERRO (19/10/2026). Depois de expurgar a última escola, o
          # repositório fica sem `.conf` de variante nenhum — e um repositório sem escola é
          # um estado LEGÍTIMO: é o que existe entre o expurgo e a criação da próxima. O
          # glob vazio dizia `nenhum manifesto de variante encontrado` e saía com 1, o que
          # pintava de vermelho um workflow que não tinha nada para fazer. Um push de
          # expurgo derrubava o `Reancorar` por não haver o que reancorar.
          #
          # A distinção que importa: «não há escola» (nada a fazer, sucesso) ≠ «há escola e
          # a âncora não fecha» (falha, abaixo). Só a segunda é sinal de problema.
          if [ "${#manifestos[@]}" -eq 0 ]; then
            echo "nenhuma escola no repositório — nada a reancorar"
            echo "tocados=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tocados=0

          for manifesto in "${manifestos[@]}"; do
            # professores/<professor>/ciclos/ciclo-<NN>-<escola>.conf
            resto="${manifesto#professores/}"
            professor="${resto%%/*}"
            nome="$(basename "$manifesto" .conf)"       # ciclo-<NN>-<escola>
            sem_ciclo="${nome#ciclo-}"                  # <NN>-<escola>
            ciclo="${sem_ciclo%%-*}"                    # <NN>  (já com dois dígitos)
            escola="${sem_ciclo#*-}"                    # <escola>

            alvo="$professor $ciclo $escola"

            if tools/hash-ciclo.sh "$professor" "$ciclo" "$escola" --check > /dev/null 2>&1; then
              echo "ok: $alvo — âncora íntegra"
              continue
            fi

            echo "divergiu: $alvo — reancorando"

            # Modo `gerar`: reescreve o .fipp do ciclo E os -aula-NN.fipp, numa só chamada.
            # Se a fonte estiver inválida (schema da aula, PO), o próprio script recusa e
            # o passo falha — é o sinal de que o problema é a fonte, não a âncora.
            if ! tools/hash-ciclo.sh "$professor" "$ciclo" "$escola"; then
              echo "erro: não foi possível reancorar $alvo" >&2
              exit 1
            fi

            # O script saiu 0; confirmar que o .fipp resultante fecha.
            if ! tools/hash-ciclo.sh "$professor" "$ciclo" "$escola" --check > /dev/null 2>&1; then
              echo "erro: $alvo continua divergente depois de reancorar" >&2
              exit 1
            fi

            tocados=$((tocados + 1))
          done

          echo "ciclos reancorados: $tocados"
          echo "tocados=$tocados" >> "$GITHUB_OUTPUT"

      - name: Commitar as âncoras novas
        if: steps.reancorar.outputs.tocados != '0'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- '*.fipp'

          # O ÍNDICE ENTRA NO MESMO COMMIT — E TEM DE ENTRAR (22/10/2026).
          #
          # A ÂNCORA ESTÁ NO ÍNDICE (verificação 3 do `check-indices.js`): um `.fipp` novo muda
          # o acervo. Mas este workflow commita com o `GITHUB_TOKEN`, que POR DESENHO não
          # redispara workflows — logo o `regerar-indices.yml` NUNCA vê este commit. Medido no
          # cadastro do `teclado-abnt`: o `Regerar` correu numa das execuções em fila e commitou
          # (`36e91a8`), o `Reancorar` commitou o `.fipp` da `batata` logo depois (`f8b3ede`), e
          # o índice ficou a apontar para o estado de antes — três divergências no `--check`.
          #
          # A regra que sobra: quem commita com o `GITHUB_TOKEN` regera o derivado no PRÓPRIO
          # commit, porque ninguém vai fazer isso por ele depois. O `criar-escola.yml` já o
          # fazia; este e o `gerar-ciclo.yml` não.
          node tools/gerar-indices.js \
            || { echo "erro: os índices não foram regerados — a âncora nova não chegaria ao acervo" >&2; exit 1; }
          git add -A -- indices/

          if git diff --cached --quiet; then
            echo "nada a commitar"
            exit 0
          fi

          git commit -m "chore(estrutura): reancorar a cadeia das fontes alteradas" \
            -m "A âncora cobre as fontes do ciclo, e o -dados.json é uma delas: lançar
          uma aula desatualiza a âncora. Reancoragem automática, pelo .github/workflows." \
            -m "Refs: tools/hash-ciclo.sh, REGISTRO.md
          Regras: P-03, P-04, P-08
          Auditoria: .github/workflows/reancorar.yml --check antes de gerar"

          # A ÂNCORA REGERA-SE DEPOIS DO REBASE. Uma vez que o commit assenta sobre um `main`
          # novo, a âncora que ele carrega foi calculada sobre as fontes ANTIGAS — e a âncora
          # não é texto que se escolha, é DERIVADA (tools/hash-ciclo.sh). Aqui ela é
          # recalculada para todo o ciclo que divergir; o `--check` deixa intacto o que já
          # fecha, então rodar isto sempre não gera commit por nada.
          reancorar_tudo() {
            shopt -s nullglob
            local m resto professor nome sem_ciclo ciclo escola mudou=0
            for m in professores/*/ciclos/ciclo-*-*.conf; do
              resto="${m#professores/}"
              professor="${resto%%/*}"
              nome="$(basename "$m" .conf)"
              sem_ciclo="${nome#ciclo-}"
              ciclo="${sem_ciclo%%-*}"
              escola="${sem_ciclo#*-}"
              if tools/hash-ciclo.sh "$professor" "$ciclo" "$escola" --check > /dev/null 2>&1; then
                continue
              fi
              echo "reancorando $professor/$ciclo/$escola sobre o main novo"
              if ! tools/hash-ciclo.sh "$professor" "$ciclo" "$escola" > /dev/null; then
                echo "erro: não foi possível reancorar $professor/$ciclo/$escola" >&2
                return 1
              fi
              mudou=1
            done
            if [ "$mudou" = 1 ]; then
              git add -- '*.fipp'
              # O índice de novo, sobre a árvore que resultou do rebase — a mesma razão do
              # commit inicial: a âncora está no acervo, e o push daqui não redispara nada.
              node tools/gerar-indices.js || return 1
              git add -A -- indices/
              # A ÂNCORA REGERADA PODE SER A QUE O `main` NOVO JÁ TINHA (19/10/2026). O commit
              # desta reancoragem existia só para trocar a âncora antiga por uma nova; se a
              # nova é igual à que o pai já traz, o commit fica vazio — e `git commit --amend`
              # recusa («would make it empty», saída 1), derrubando o job com o push por fazer.
              # Numa reancoragem o commit vazio é o resultado CERTO: descarta-se o commit, não
              # a correcção. `--soft` move só o ponteiro; o que ficou no índice é idêntico ao
              # pai, então a árvore continua limpa.
              if git diff --cached --quiet HEAD^; then
                echo "a âncora regerada é a que o main novo já tinha — commit dispensado"
                git reset --soft HEAD^
              else
                git commit --amend --no-edit
              fi
            fi
            return 0
          }

          # O PUSH PODE PERDER A CORRIDA, E O `.fipp` TEM DOIS DONOS (19/10/2026). Mais de um
          # workflow escreve no `main` — este, o `gerar-ciclo.yml` e o `deploy-escolas.yml` — e
          # o «Guardar» do PO dispara todos em segundos. Medido às 18:40:19 de 19/10/2026, no
          # ciclo 01 de calango: `push` recusado e o rebase morria em
          # «CONFLICT (content): ... ciclo-01-calango-bale-nivel-1-teste-1.fipp».
          #
          # Resolver esse conflito à mão (ou com `-X ours`) seria escolher entre duas âncoras.
          # O certo é o mesmo do `gerar-ciclo.yml`: rebaseia; se o rebase parar num `.fipp`,
          # aceita a versão que está a ser aplicada, termina o rebase, e **reancora de novo**.
          # Qualquer outro conflito é de conteúdo e tem de falhar — escondê-lo seria pior.
          for intento in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push recusado (tentativa $intento) — rebaseando sobre o main"
            git fetch origin main

            if git rebase origin/main; then
              reancorar_tudo
              sleep $((intento * 5))
              continue
            fi

            # O REBASE PODE NEM TER COMEÇADO (20/10/2026). Um arquivo UNTRACKED que o `main`
            # novo também traz faz o git recusar o checkout antes de aplicar commit nenhum —
            # e aí não há conflito para inspecionar: o `--diff-filter=U` volta vazio e o laço
            # lia isso como «conflito de conteúdo», culpando o conteúdo por uma árvore suja.
            # É o mesmo caso que derrubou o `gerar-ciclo.yml` às 21:57 de hoje com a âncora
            # de uma aula; aqui a defesa entra igual, para o diagnóstico não mentir.
            if [ ! -d "$(git rev-parse --git-path rebase-merge)" ] &&
               [ ! -d "$(git rev-parse --git-path rebase-apply)" ]; then
              # Os soltos que o `main` traz são SAÍDAS do que este workflow gera: a versão
              # canónica é a que chega do `main`, e a desta árvore regera-se no `reancorar_tudo`
              # da volta seguinte. Só esses se apagam — qualquer outro solto é de alguém.
              apagados=0
              while IFS= read -r solto; do
                [ -n "$solto" ] || continue
                if git cat-file -e "origin/main:$solto" 2>/dev/null; then
                  rm -f -- "$solto"
                  apagados=$((apagados + 1))
                fi
              done < <(git ls-files --others --exclude-standard)
              if [ "$apagados" -eq 0 ]; then
                echo "erro: o rebase não começou e não há solto da geração para limpar — ver a saída acima" >&2
                exit 1
              fi
              echo "o rebase não começou: $apagados solto(s) da geração removido(s) — nova tentativa"
              sleep $((intento * 5))
              continue
            fi

            conflitos="$(git diff --name-only --diff-filter=U || true)"
            if [ -z "$conflitos" ] || printf '%s\n' "$conflitos" | grep -qv '\.fipp$'; then
              echo "erro: conflito de conteúdo (não é a âncora) — não se resolve automaticamente:" >&2
              printf '%s\n' "$conflitos" >&2
              git rebase --abort || true
              exit 1
            fi

            echo "conflito APENAS na âncora — aplicar a versão do commit e regerar"
            git checkout --theirs -- '*.fipp' || git checkout --ours -- '*.fipp'
            git add -- '*.fipp'
            GIT_EDITOR=true git rebase --continue

            reancorar_tudo
            sleep $((intento * 5))
          done
          echo "erro: o push continuou recusado depois de 5 tentativas" >&2
          exit 1
