# ============================================================================
# Ciclo 01 — manifesto BASE. Escola e contexto institucional ficam na
# variante (ciclo-01-<escola>.conf), que sobrescreve estes valores
# (Pré-requisito 5).
#
#   tools/gerar-ciclo.sh demi-plie 01 breu
#
# ESCOLA SIMULADA — criada do zero por tools/criar-escola.sh. Nada pedagógico
# foi inventado: o objetivo geral fica como lacuna e o DOCS começa vazio. O
# primeiros artefatos reais são o plano e o PO, elicitados pela porta.
# ============================================================================

CICLO="01"
NOME="Ciclo 01 — Breu"

# Objetivo geral: provisório declarado — o plano elicitado é quem o estabelece.
OBJETIVO_GERAL="[Preencher: objetivo geral do ciclo — o plano elicitado o estabelece]"

PROFESSOR="Demi Plié"

# Número de encontros do ciclo (Pré-requisito 1 da Regra 10)
TOTAL_AULAS="5"

# Faixas de volume ativo por duração de aula (Regra 9, etapa 1)
VOLUME_MIN="80"          # faixa de 60 min
VOLUME_MAX="100"
# A LINHA DE 90 MIN FALTAVA, E A SUA AUSÊNCIA PARTIU UMA GERAÇÃO (20/11/2026). A Sala `Rosa`
# passou de 60 para 90 minutos; o `comporConf` exige `VOLUME_MIN_90`/`VOLUME_MAX_90` acima dos 60,
# não as encontrou, e o `gerar-ciclo` morreu com «sem faixa de volume para 90 min». O site ficou
# com o pacote antigo — 45 min e fim 05/02 — enquanto a Sala já dizia 08/01.
#
# OS NÚMEROS NÃO SÃO INVENTADOS: são a linha de 90 min da tabela da Regra 9 (etapa 1), que este
# repositório declara em `experimentos/simulacao-marau/ciclo-01-marau-plano.md` — a mesma tabela
# de que as linhas de 60 e 120 daqui foram copiadas (80–100 e 150–200, conferem). A faixa foi
# escolhida pela proprietária em 20/11/2026.
VOLUME_MIN_90="120"      # faixa de 90 min
VOLUME_MAX_90="150"
# A LINHA DE 110 MIN — e esta é a primeira que NÃO está na tabela (20/11/2026). A tabela da
# Regra 9 declara 60, 75, 90 e 120; a Sala `Rosa` passou a ter aulas de 110 minutos, e entre 90
# (120–150) e 120 (150–200) não há linha. O valor foi INTERPOLADO e a interpolação foi escolhida
# pela proprietária em 20/11/2026, com a lacuna declarada: 145–185, que mantém a razão entre o
# mínimo e o máximo das duas linhas vizinhas.
#
# Fica escrito porque é o primeiro caso em que a tabela não responde — e a alternativa seria o
# sistema inventar uma dose de trabalho, que é dado pedagógico e não lhe pertence.
VOLUME_MIN_110="145"     # faixa de 110 min (interpolada entre 90 e 120 — ver a nota acima)
VOLUME_MAX_110="185"
VOLUME_MIN_120="150"     # faixa de 120 min
VOLUME_MAX_120="200"

# Documentos, na ordem em que aparecem no PDF e no menu. COMEÇA VAZIO: nenhum
# documento foi escrito. O plano elicitado será a primeira fonte
# (ciclo-01-breu-po.md); plano e aulas entram quando forem escritos.
DOCS=""
