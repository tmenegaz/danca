# --- conteúdo do ciclo (próprio desta escola) -------------------------------
NOME="Ciclo 01 — Ritmos e Movimento"

# Objetivo geral: declarado pelo professor na entrega de 18/09/2026, transcrito
# sem alteração (Regra 10).
OBJETIVO_GERAL="Passar comandos básicos para os meninos e as meninas nas aulas de pas de deux, exigindo como pré-requisitos o domínio das posições básicas do balé (primeira, segunda, quarta e quinta), posições de braços (primeira, segunda, terceira, quarta e quinta), além de boa coordenação motora e distribuição de peso."

# Número de encontros do ciclo (Pré-requisito 1 da Regra 10)
