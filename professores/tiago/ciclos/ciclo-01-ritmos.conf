# ============================================================================
# Ciclo 01 — variante: Ritmos e Movimento (Gabi)
# Pré-requisito 5: contexto institucional e frequência.
#
# ESTE CICLO É PRÓPRIO DESTA ESCOLA. Antes, as três variantes liam o mesmo
# conteúdo (o da Duo), porque o gerador e o hasher não distinguiam as escolas —
# o pacote da Ritmos saía com o plano e a aula da Duo. Corrigido em 18/09/2026:
# as fontes desta escola são `ciclo-01-ritmos-<doc>.md`, que têm precedência
# sobre as sem sufixo (ver tools/lib-fontes.sh).
#
# Este arquivo é lido DEPOIS de ciclos/ciclo-01.conf e sobrescreve o que muda —
# aqui, o conteúdo inteiro: escola de pas de deux, 20 encontros.
# ============================================================================

# --- identificação e contexto institucional (Pré-requisito 5) ---------------
VARIANTE="ritmos"
ESCOLA="Ritmos e Movimento"
RESPONSAVEL="Gabi"
FREQUENCIA="3 aulas/semana"
# Dois DIAS de aula, TRÊS aulas: a terça tem 1 (pas de deux) e o sábado tem 2
# (1 de balé, como preparação, + 1 de pas de deux). O dia repetido na lista é o
# que diz isso ao calendário: `len(DIAS)` é o número de aulas por semana, e a
# contagem de cada dia é quantas vezes ele aparece (2,6,6 = terça 1 · sábado 2).
DIAS="2,6,6"             # 2 = terça (1 aula), 6 = sábado (2 aulas, mesma data)
DURACAO_POR_DIA="60 min em cada uma das 3 aulas semanais (terça: 1 · sábado: 2)"
# DECISÃO (18/09/2026): o ciclo tem 3 aulas de 60 min por semana, então as três
# durações da lista são iguais. O gerador lê a primeira e a última
# (DUR_CURTA/DUR_LONGA) e, sendo iguais, trata como duração única — é por isso que
# a forma "60,60,60" não quebra nada e exige só `volume-total` em cada aula.
# O dia longo de 120 min deixou de existir: o sábado são duas aulas de 60.
DURACOES="60,60,60"
DATA_INICIO="19/09/2026" # sábado — dia de aula desta escola

# --- conteúdo do ciclo (próprio desta escola) -------------------------------
NOME="Ciclo 01 — Ritmos e Movimento"

# Objetivo geral: declarado pelo professor na entrega de 18/09/2026, transcrito
# sem alteração (Regra 10).
OBJETIVO_GERAL="Passar comandos básicos para os meninos e as meninas nas aulas de pas de deux, exigindo como pré-requisitos o domínio das posições básicas do balé (primeira, segunda, quarta e quinta), posições de braços (primeira, segunda, terceira, quarta e quinta), além de boa coordenação motora e distribuição de peso."

# Número de encontros do ciclo (Pré-requisito 1 da Regra 10)
TOTAL_AULAS="21"

# Faixas de volume ativo por duração de aula (Regra 9, etapa 1)
VOLUME_MIN="80"          # faixa de 60 min — a única faixa usada neste ciclo
VOLUME_MAX="100"
# As linhas de 120 min continuam declaradas, mas NÃO são usadas: nenhuma das três
# aulas semanais dura mais de 60 min. Se o ciclo voltar a ter dia longo, basta
# incluir 120 em DURACOES e a faixa abaixo passa a valer.
VOLUME_MIN_120="150"
VOLUME_MAX_120="200"

# Documentos desta escola, na ordem em que aparecem no PDF e no menu.
# Espelha a ordem do ciclo piloto (o da Duo), com o prefixo desta variante.
# `harmonizacao` entra logo depois do plano: é documento que o professor precisa
# ver cedo (é a tabela bruto x harmonizado que ele revisa — P-21).
# Ainda FALTAM quatro documentos — notacao, glossario-benesh, musicalidade e
# musicalidade-aluna —, porque os equivalentes do ciclo piloto carregam conteúdo
# do ciclo dele (o registro dos exercícios dele, as contagens das aulas dele), e
# replicá-los exigiria inventar conteúdo que o professor não deu. Não entram em DOCS
# enquanto não forem decididos: uma entrada aqui sem arquivo gera link morto.
DOCS="plano harmonizacao aula-01 relatorio-aula-01 captura-aula-01 pre-requisitos apanhado-historico referencias guia-do-professor"

