# ============================================================================
# Ciclo 01 — manifesto BASE (conteúdo compartilhado pelas escolas).
# O contexto institucional (escola, frequência, dias, duração por dia) fica em
# ciclos/ciclo-01-<escola>.conf, que sobrescreve estes valores (Pré-requisito 5).
#
#   tools/gerar-ciclo.sh 01 duo       → pacote do Duo
#   tools/gerar-ciclo.sh 01 ritmos    → pacote de Ritmos e Movimento
#   tools/gerar-ciclo.sh 01 debora    → pacote de Débora (Marau)
# ============================================================================

CICLO="01"
NOME="Ciclo 01 — Fundamentos do Balé Clássico"

# Objetivo geral: uma frase, verificável ao final do ciclo (Regra 10)
OBJETIVO_GERAL="Construir a estabilidade nas cinco posições dos pés e a coordenação braço-perna (1ª, 2ª e intermediários), com transferência de peso por cima, musicalidade e resistência progressiva."

PROFESSOR="Tiago Menegaz"

# Número de aulas do ciclo (Pré-requisito 1 da Regra 10)
TOTAL_AULAS="12"

# Faixas de volume ativo por duração de aula (Regra 9, etapa 1)
VOLUME_MIN="80"          # faixa de 60 min
VOLUME_MAX="100"
VOLUME_MIN_120="150"     # faixa de 120 min
VOLUME_MAX_120="200"

# Documentos, na ordem em que aparecem no PDF e no menu de navegação.
# As aulas seguem a numeração de dois dígitos (aula-01, aula-02, ...).
# `harmonizacao` entra logo depois do plano: é documento que o professor precisa ver
# cedo (a tabela bruto × harmonizado que ele revisa — P-21), e a P-17 exige o artefato
# em todo ciclo que tem aula. A variante Ritmos declara o seu próprio DOCS, com o
# mesmo lugar para a harmonização dela.
DOCS="plano harmonizacao aula-01 relatorio-aula-01 captura-aula-01 caderno-01 notacao glossario-benesh pre-requisitos musicalidade musicalidade-aluna apanhado-historico referencias guia-do-professor metodo"


