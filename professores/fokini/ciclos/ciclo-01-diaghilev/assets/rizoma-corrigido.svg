<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg" style="background:#fbf8f3;font-family:Georgia,serif;">
  <defs>
    <style>
      .lbl { font-family: Georgia, serif; text-anchor: middle; }
      .grande { font-size: 14px; font-weight: bold; }
      .medio { font-size: 11px; font-weight: bold; }
      .pequeno { font-size: 9px; }
      .sub { font-size: 8px; fill: #8a6a3b; }
    </style>
  </defs>

  <!-- Arestas: sólida = formação (corpo a corpo) · tracejada = influência · pontilhada = interpretação -->
  <g stroke="#b08d57" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M 120 80 L 200 80"/>
    <path d="M 480 130 L 560 130"/>
    <path d="M 640 130 Q 700 130 740 100"/>
    <path d="M 480 145 Q 480 220 520 250"/>
    <path d="M 800 160 Q 900 160 950 250"/>
    <path d="M 560 280 L 620 280"/>
    <path d="M 680 280 L 740 336"/>
    <path d="M 560 290 Q 560 360 620 380"/>
    <path d="M 660 480 L 660 520"/>
    <path d="M 600 440 L 620 470"/>
    <path d="M 820 310 L 856 362"/>
    <path d="M 772 238 Q 790 252 800 272"/>
    <path d="M 440 150 L 440 158"/>
    <path d="M 658 298 L 656 306"/>
    <path d="M 842 362 L 808 352"/>
    <path d="M 826 372 L 812 396"/>
    <path d="M 838 398 C 792 426, 730 404, 702 392"/>
    <path d="M 950 268 Q 1050 350 1080 480"/>
    <path d="M 830 336 Q 950 420 1075 492"/>
    <path d="M 810 400 Q 950 450 1075 496"/>
    <path d="M 838 400 Q 960 440 1075 500"/>
    <path d="M 890 118 Q 870 150, 832 158"/>
    <path d="M 280 80 Q 350 80 400 50" stroke-dasharray="7 5"/>
    <path d="M 280 80 Q 350 80 400 90" stroke-dasharray="7 5"/>
    <path d="M 280 80 Q 350 80 400 130" stroke-dasharray="7 5"/>
    <path d="M 640 130 Q 700 130 740 160" stroke-dasharray="7 5"/>
    <path d="M 612 258 Q 622 224 628 218" stroke-dasharray="7 5"/>
    <path d="M 260 104 Q 280 120 298 132" stroke-dasharray="7 5"/>
    <path d="M 392 140 L 398 132" stroke-dasharray="7 5"/>
    <path d="M 480 174 Q 520 158 558 138" stroke-dasharray="7 5"/>
    <path d="M 470 114 C 700 24, 900 56, 1116 130" stroke-dasharray="7 5"/>
    <path d="M 640 132 Q 760 112 846 102" stroke-dasharray="2 4"/>
    <path d="M 640 150 C 850 300, 960 300, 1116 284" stroke-dasharray="2 4"/>
  </g>

  <!-- GERAÇÃO 1: Origens (séc. XVIII) -->
  <g>
    <rect x="32" y="60" width="96" height="40" rx="6" fill="#6b1f2e"/>
    <text x="80" y="78" class="lbl grande" fill="#ffffff">John Weaver</text>
    <text x="80" y="92" class="lbl sub" fill="#b08d57">1717 · Londres</text>
  </g>
  <g>
    <rect x="200" y="60" width="80" height="40" rx="6" fill="#6b1f2e"/>
    <text x="240" y="78" class="lbl grande" fill="#ffffff">Noverre</text>
    <text x="240" y="92" class="lbl sub" fill="#b08d57">1760 · França</text>
  </g>

  <!-- GERAÇÃO 2: Europa séc. XIX -->
  <g>
    <rect x="400" y="30" width="80" height="36" rx="6" fill="#b08d57"/>
    <text x="440" y="52" class="lbl medio" fill="#ffffff">Bournonville</text>
  </g>
  <g>
    <rect x="400" y="72" width="80" height="36" rx="6" fill="#b08d57"/>
    <text x="440" y="94" class="lbl medio" fill="#ffffff">Cecchetti</text>
  </g>
  <g>
    <rect x="400" y="114" width="80" height="36" rx="6" fill="#b08d57"/>
    <text x="440" y="136" class="lbl grande" fill="#ffffff">Petipa</text>
  </g>

  <!-- GERAÇÃO 3: Europa início do séc. XX -->
  <g>
    <rect x="560" y="112" width="80" height="36" rx="6" fill="#b08d57"/>
    <text x="600" y="134" class="lbl medio" fill="#ffffff">Fokine</text>
  </g>
  <g>
    <rect x="740" y="82" width="80" height="36" rx="6" fill="#b08d57"/>
    <text x="780" y="104" class="lbl medio" fill="#ffffff">Balanchine</text>
  </g>
  <g>
    <rect x="740" y="142" width="90" height="36" rx="6" fill="#b08d57"/>
    <text x="785" y="164" class="lbl medio" fill="#ffffff">M. de Cuevas</text>
  </g>

  <!-- GERAÇÃO 4: Brasil (meados do séc. XX) -->
  <g>
    <rect x="512" y="250" width="98" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="561" y="270" class="lbl grande" fill="#6b1f2e">Maria Olenewa</text>
    <text x="565" y="282" class="lbl sub">Rio · 1927</text>
  </g>
  <g>
    <rect x="620" y="262" width="80" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="660" y="282" class="lbl medio" fill="#6b1f2e">V. Veltchek</text>
    <text x="660" y="294" class="lbl sub">1939</text>
  </g>
  <g>
    <rect x="950" y="232" width="90" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="995" y="252" class="lbl grande" fill="#6b1f2e">Delavalle</text>
    <text x="995" y="264" class="lbl sub">BTG · Passo Fundo</text>
  </g>
  <g>
    <rect x="740" y="318" width="90" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="785" y="338" class="lbl medio" fill="#6b1f2e">Yellê Bittencourt</text>
  </g>
  <g>
    <rect x="620" y="372" width="80" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="660" y="392" class="lbl medio" fill="#6b1f2e">Ady Addor</text>
  </g>

  <!-- RAMO DA DANÇA MODERNA (linhagem paralela, não deriva de Noverre) -->
  <g>
    <rect x="560" y="420" width="80" height="36" rx="6" fill="#e8dcc8" stroke="#b08d57" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="600" y="440" class="lbl medio" fill="#5a5348">Mary Wigman</text>
    <text x="600" y="452" class="lbl sub">Alemanha</text>
  </g>
  <g>
    <rect x="620" y="470" width="80" height="36" rx="6" fill="#e8dcc8" stroke="#b08d57" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="660" y="490" class="lbl medio" fill="#5a5348">Yanka Rudzka</text>
    <text x="660" y="502" class="lbl sub">Bahia · 1952</text>
  </g>
  <g>
    <rect x="620" y="520" width="80" height="36" rx="6" fill="#e8dcc8" stroke="#b08d57" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="660" y="540" class="lbl medio" fill="#5a5348">Rolf Gelewski</text>
    <text x="660" y="552" class="lbl sub">Bahia · 1960</text>
  </g>

  <!-- GERAÇÃO 5: São Paulo (final do séc. XX) -->
  <g>
    <rect x="780" y="274" width="80" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="820" y="294" class="lbl medio" fill="#6b1f2e">Maria Pia</text>
  </g>
  <g>
    <rect x="820" y="362" width="96" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="868" y="382" class="lbl grande" fill="#6b1f2e">Balé da Cidade</text>
    <text x="868" y="394" class="lbl sub">SP · 1968</text>
  </g>
  <g>
    <rect x="730" y="382" width="80" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="770" y="404" class="lbl medio" fill="#6b1f2e">A. Poulin</text>
  </g>

  <!-- GERAÇÃO 6: Tiago (um ponto pequeno no mapa) -->
  <g>
    <circle cx="1080" cy="500" r="12" fill="#6b1f2e" stroke="#b08d57" stroke-width="3"/>
    <text x="1080" y="530" class="lbl pequeno" fill="#6b1f2e" font-weight="bold">TIAGO MENEGAZ</text>
    <text x="1080" y="544" class="lbl sub">2026</text>
  </g>

  <!-- Origem de Maria Pia: a Escola Municipal de Bailados (SP, 1940), herdeira da tradição russa -->
  <g>
    <rect x="624" y="200" width="150" height="38" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="1.5"/>
    <text x="699" y="218" class="lbl medio" fill="#6b1f2e">Escola Mun. de Bailados</text>
    <text x="699" y="230" class="lbl sub">São Paulo · 1940</text>
    <text x="548" y="244" class="lbl sub" fill="#8a6a3b">tradição russa</text>
  </g>

  <!-- Nureyev: interpretou Fokine e foi acolhido por Cuevas -->
  <g>
    <rect x="850" y="82" width="110" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="1.5"/>
    <text x="905" y="102" class="lbl medio" fill="#6b1f2e">Nureyev</text>
    <text x="905" y="114" class="lbl sub">interpretou Fokine</text>
  </g>

  <!-- Didelot e Ivanov: a ponte entre Noverre e a escola russa -->
  <g>
    <rect x="300" y="120" width="90" height="36" rx="6" fill="#e8dcc8" stroke="#b08d57" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="345" y="136" class="lbl medio" fill="#5a5348">Didelot</text>
    <text x="345" y="148" class="lbl sub">→ escola russa</text>
  </g>
  <g>
    <rect x="400" y="156" width="80" height="36" rx="6" fill="#b08d57"/>
    <text x="440" y="172" class="lbl medio" fill="#ffffff">Ivanov</text>
    <text x="440" y="184" class="lbl sub" fill="#fdf6ea">Quebra-Nozes 1892</text>
  </g>

  <!-- Continuadores da escola russa, hoje -->
  <g>
    <rect x="1118" y="114" width="132" height="36" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="1.5"/>
    <text x="1184" y="130" class="lbl medio" fill="#6b1f2e">Osipova</text>
    <text x="1184" y="142" class="lbl sub">Academia Bolshoi</text>
  </g>
  <g>
    <rect x="1118" y="266" width="132" height="38" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="1.5"/>
    <text x="1184" y="282" class="lbl medio" fill="#6b1f2e">Baryshnikov</text>
    <text x="1184" y="295" class="lbl sub">interpretou Fokine (ABT)</text>
  </g>

  <!-- Marcia Haydée: formada no Brasil, estrela e diretora do Stuttgart Ballet -->
  <g>
    <rect x="606" y="308" width="96" height="38" rx="6" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="654" y="324" class="lbl grande" fill="#6b1f2e">M. Haydée</text>
    <text x="654" y="337" class="lbl sub">Stuttgart Ballet</text>
  </g>

  <!-- Legenda -->
  <g>
    <rect x="40" y="632" width="12" height="12" rx="2" fill="#6b1f2e"/>
    <text x="58" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">Origens</text>
    <rect x="140" y="632" width="12" height="12" rx="2" fill="#b08d57"/>
    <text x="158" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">Europa</text>
    <rect x="240" y="632" width="12" height="12" rx="2" fill="#fbf8f3" stroke="#b08d57" stroke-width="2"/>
    <text x="258" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">Brasil (clássico)</text>
    <rect x="390" y="632" width="12" height="12" rx="2" fill="#e8dcc8" stroke="#b08d57" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="408" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">Brasil (moderna)</text>
    <circle cx="540" cy="638" r="6" fill="#6b1f2e" stroke="#b08d57" stroke-width="2"/>
    <text x="555" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">Eu</text>
    <line x1="610" y1="638" x2="640" y2="638" stroke="#b08d57" stroke-width="1.8"/>
    <text x="648" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">formação</text>
    <line x1="760" y1="638" x2="790" y2="638" stroke="#b08d57" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="798" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">influência</text>
    <line x1="910" y1="638" x2="940" y2="638" stroke="#b08d57" stroke-width="1.8" stroke-dasharray="2 4"/>
    <text x="948" y="642" class="lbl pequeno" fill="#8a6a3b" text-anchor="start">interpretação</text>
  </g>
</svg>
