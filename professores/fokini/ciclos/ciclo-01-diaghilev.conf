# ============================================================================
# Ciclo 01 — variante: Diaghilev (professor Fokini)
# Pré-requisito 5: contexto institucional e frequência.
#
# ESCOLA SIMULADA — exercício de instalação de ciclo (23/09/2026). O nome da escola
# homenageia Diaghilev, dos Ballets Russes; o professor é fictício. Não é material
# pedagógico real: é o teste da cadeia inteira — documentos → extratores → JSON →
# formulário → âncora.
# ============================================================================

# --- identificação e contexto institucional (Pré-requisito 5) ---------------
VARIANTE="diaghilev"
ESCOLA="Diaghilev"
RESPONSAVEL="Fokini"

# --- habilitação desta escola ------------------------------------------------
# A flag é POR ESCOLA, não por professor: desabilitar esta não toca nas outras
# escolas do mesmo professor. O valor é declarado aqui porque o caso de uso
# (inadimplência, churn, queda do sistema) é do vínculo professor × escola.
#
#   ESCOLA_HABILITADA="sim"  → habilitada (a ausência do campo vale o mesmo)
#   ESCOLA_HABILITADA="nao"  → desabilitada, e então o schema EXIGE dizer pelo
#                              menos POR QUE (ESCOLA_HABILITADA_MOTIVO) e DESDE
#                              QUANDO (ESCOLA_HABILITADA_DESDE, dd/mm/aaaa).
#                              Reancorar recusa o .conf que declarar "nao" sem
#                              os dois — não é booleano solto.
#
# Declarar "sim" é explícito de propósito: mostra ao painel da escola que o
# estado foi conferido, e não apenas herdado da ausência do campo.
ESCOLA_HABILITADA="sim"

FREQUENCIA="2x/semana"
DIAS="2@19:00,4@19:00"   # 2 = terça, 4 = quinta — HORA FICTÍCIA, como todo este ciclo
                         # simulado (ver o cabeçalho): não houve aula real, então não há
                         # hora de caderno para transcrever. Ela existe para exercitar o
                         # prazo (ARQUITETURA-AULA.md §3.1), que conta do fim da aula.
DURACAO_POR_DIA="60 min em cada um dos dois encontros semanais"
DURACOES="60"
DATA_INICIO="06/10/2026" # terça-feira — dia de aula desta escola

# --- conteúdo do ciclo (próprio desta escola) -------------------------------
NOME="Ciclo 01 — Diaghilev"

# Objetivo geral declarado pelo professor (transcrito — Regra 10, camada 1).
OBJETIVO_GERAL="Construir o eixo vertical e a transferência de peso em movimento, com resposta ao pulso e presença cênica, em cinco encontros de 60 minutos."

TOTAL_AULAS="5"

VOLUME_MIN="80"
VOLUME_MAX="100"
VOLUME_MIN_120="150"
VOLUME_MAX_120="200"

# Documentos, na ordem em que aparecem no PDF e no menu de navegação.
# As aulas seguem a numeração de dois dígitos (aula-01, aula-02, ...).
# A Aula 05 é suplementar: declara o método RAD pelos exercícios de barra e
# registra o exercício em notação Benesh (P-15). Por isso este ciclo passa a
# ter `notacao` e `glossario-benesh`, e a P-16 exige que o par venha junto.
DOCS="plano harmonizacao aula-01 aula-02 aula-03 aula-04 aula-05 guia-de-observacao-01 captura-aula-01 caderno-01 notacao glossario-benesh referencias guia-do-professor metodo"
